name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Protects against hanging processes consuming billing minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: 1. SAST - TypeScript Type Verification
        run: npx tsc --noEmit

      - name: 2. SAST - ESLint Code Quality Guardrails
        run: npm run lint

      - name: 3. SCA - Production Vulnerability Audit
        run: npm audit --only=prod --audit-level=high

      - name: 4. Build Production Bundle
        run: npm run build

      - name: 5. Deploy to GitHub Pages (Master Only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true



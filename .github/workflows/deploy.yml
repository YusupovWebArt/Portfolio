name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Triggers on push to master

permissions:
  contents: write # Required for pushing build output to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies (High/Critical)
        run: npm audit --only=prod --audit-level=high

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Code Lint Check
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

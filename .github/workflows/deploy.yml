name: CI/CD & Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.agents/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 0. Secret Scan - Gitleaks (Working Tree)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f gitleaks.tar.gz
          gitleaks detect --no-git --source . --redact -v

      - name: Setup pnpm Environment
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Clean Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. SAST - TypeScript Type Verification
        run: pnpm exec tsc --noEmit

      - name: 2. SAST - ESLint Code Quality Guardrails
        run: pnpm lint

      - name: 3. TDD - Automated Unit & Component Tests
        run: pnpm test

      - name: 4. SCA - Production Vulnerability Audit
        run: pnpm audit --prod --audit-level=high

      - name: 5. Build Production Bundle
        run: pnpm build

      - name: 5b. Contact leak scan (built output)
        run: node scripts/check-contact-leak.mjs

      - name: 6. Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 7. A11y & E2E - WCAG 2.2 AA & Browser Flows
        run: pnpm test:e2e

      - name: 8. LHCI - Core Web Vitals & Quality Audit
        run: pnpm audit:lhci

      - name: Upload Production Dist
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-artifact
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Built Distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-artifact
          path: dist

      - name: Configure Vercel Ignore for gh-pages Branch
        run: echo '{"ignoreCommand":"exit 0"}' > dist/vercel.json

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist
          branch: gh-pages
          clean: true
          commit-message: "deploy: automated build for GitHub Pages [skip ci]"

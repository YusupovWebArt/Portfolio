version: 2
updates:
  # Scan npm dependencies weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group patches/minors to prevent PR noise
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Ignore major versions that introduce breaking compatibility changes
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      - dependency-name: "lucide-react"
        versions: [">= 1.0.0"]

  # Scan GitHub Actions workflows weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

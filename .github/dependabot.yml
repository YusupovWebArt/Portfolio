version: 2
updates:
  # Scan npm dependencies weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group patches/minors to prevent PR noise
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Scan GitHub Actions workflows weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

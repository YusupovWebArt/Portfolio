<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cwvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <!-- Glowing gradients -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glowCwv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridCwv" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#cwvBg)" />
  <rect width="1200" height="630" fill="url(#gridCwv)" />

  <!-- Ambient light orbs -->
  <circle cx="320" cy="280" r="220" fill="#10b981" opacity="0.08" filter="url(#glowCwv)" />
  <circle cx="860" cy="300" r="240" fill="#06b6d4" opacity="0.09" filter="url(#glowCwv)" />
  <circle cx="600" cy="160" r="180" fill="#84cc16" opacity="0.07" filter="url(#glowCwv)" />

  <!-- Central Engineering Dashboard -->
  <g transform="translate(160, 85)">
    <!-- Main Console Frame -->
    <rect x="60" y="40" width="760" height="390" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
    <rect x="60" y="40" width="760" height="390" rx="24" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

    <!-- Window Controls -->
    <circle cx="95" cy="72" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="115" cy="72" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="135" cy="72" r="5" fill="#10b981" opacity="0.8" />
    <line x1="160" y1="72" x2="330" y2="72" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Performance Gauge / Speedometer Area -->
    <g transform="translate(100, 110)">
      <rect x="0" y="0" width="220" height="150" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <!-- Speed dial arc -->
      <path d="M 40 115 A 70 70 0 1 1 180 115" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
      <path d="M 40 115 A 70 70 0 1 1 170 80" fill="none" stroke="url(#emeraldGlow)" stroke-width="12" stroke-linecap="round" filter="url(#glowCwv)" />
      <!-- Score Indicator -->
      <circle cx="110" cy="90" r="28" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <path d="M 100 90 L 108 98 L 122 84" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Sub-second latency tag -->
      <rect x="50" y="124" width="120" height="18" rx="6" fill="#10b981" fill-opacity="0.15" />
      <line x1="65" y1="133" x2="155" y2="133" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Core Web Vitals Telemetry Curves (LCP, CLS, INP) -->
    <g transform="translate(345, 110)">
      <rect x="0" y="0" width="435" height="150" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <!-- Gridlines -->
      <line x1="30" y1="40" x2="405" y2="40" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="30" y1="80" x2="405" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="30" y1="120" x2="405" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
      <!-- Sub-second curve 1: LCP drop to 0.3s -->
      <path d="M 30 110 C 100 105, 150 45, 220 38 C 290 32, 350 35, 405 32" fill="none" stroke="#10b981" stroke-width="3" filter="url(#glowCwv)" />
      <!-- Curve 2: INP optimization -->
      <path d="M 30 130 C 90 120, 160 85, 230 70 C 300 55, 360 52, 405 50" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
      <!-- Metric Nodes -->
      <circle cx="220" cy="38" r="5" fill="#10b981" />
      <circle cx="230" cy="70" r="4" fill="#06b6d4" />
      <circle cx="405" cy="32" r="5" fill="#34d399" filter="url(#glowCwv)" />
    </g>

    <!-- Bottom Row: Bundle Chunk Splitting & Media Pipeline -->
    <g transform="translate(100, 280)">
      <!-- Left: Code Splitting Tree -->
      <rect x="0" y="0" width="320" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
      <!-- Chunks visualization -->
      <rect x="25" y="25" width="70" height="35" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.5" />
      <line x1="40" y1="42" x2="80" y2="42" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
      
      <line x1="95" y1="42" x2="135" y2="42" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <rect x="135" y="15" width="80" height="30" rx="6" fill="#020617" stroke="#06b6d4" stroke-width="1.5" />
      <line x1="150" y1="30" x2="200" y2="30" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
      
      <line x1="95" y1="42" x2="135" y2="75" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      <rect x="135" y="60" width="80" height="30" rx="6" fill="#020617" stroke="#84cc16" stroke-width="1.5" />
      <line x1="150" y1="75" x2="200" y2="75" stroke="#84cc16" stroke-width="2" stroke-linecap="round" />

      <line x1="215" y1="30" x2="245" y2="30" stroke="#475569" stroke-width="1.5" />
      <circle cx="255" cy="30" r="8" fill="#10b981" filter="url(#glowCwv)" />
      
      <line x1="25" y1="105" x2="295" y2="105" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      <line x1="25" y1="105" x2="240" y2="105" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Right: WebP / Asset Streaming Pipeline -->
    <g transform="translate(440, 280)">
      <rect x="0" y="0" width="340" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
      <!-- Data blocks -->
      <g transform="translate(30, 30)">
        <rect x="0" y="0" width="55" height="55" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="27" cy="27" r="14" fill="#0284c7" fill-opacity="0.4" />
      </g>
      <path d="M 95 57 L 135 57" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3" stroke-linecap="round" filter="url(#glowCwv)" />
      <g transform="translate(145, 30)">
        <rect x="0" y="0" width="55" height="55" rx="10" fill="#020617" stroke="#10b981" stroke-width="1.5" />
        <path d="M 18 28 L 24 34 L 38 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <path d="M 210 57 L 250 57" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
      <g transform="translate(260, 30)">
        <rect x="0" y="0" width="55" height="55" rx="10" fill="#020617" stroke="#84cc16" stroke-width="1.5" filter="url(#glowCwv)" />
        <polygon points="27,15 42,42 12,42" fill="none" stroke="#84cc16" stroke-width="2" />
      </g>
      <line x1="30" y1="105" x2="310" y2="105" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
      <line x1="30" y1="105" x2="270" y2="105" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
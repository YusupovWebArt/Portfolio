<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070c1b"/>
    </linearGradient>
    <linearGradient id="voiceGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="200" cy="160" r="150" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="170" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="580" cy="320" r="220" fill="#10b981" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <!-- Category & Tech Tag -->
    <rect width="320" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="1.5">VOICE COMMERCE &amp; EDGE AI 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Voice-Driven</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#voiceGlow)" letter-spacing="-0.5">Conversational Commerce</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Web Speech API Audio Streaming, Edge Tool Calling</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Real-Time Optimistic Cart Mutations in Next.js 16</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">EDGE LATENCY</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22d3ee">&lt; 180 ms</text>

      <rect x="175" width="170" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="191" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">CLIENT OVERHEAD</text>
      <text x="191" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#a78bfa">0 KB SDKs</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">ACCESSIBILITY</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">WCAG 2.2 AA</text>
    </g>

    <!-- Audio Waveform Visualizer -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <!-- Waveform bars -->
      <line x1="25" y1="24" x2="25" y2="24" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="16" x2="45" y2="32" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
      <line x1="65" y1="10" x2="65" y2="38" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <line x1="85" y1="6" x2="85" y2="42" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="105" y1="14" x2="105" y2="34" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="125" y1="8" x2="125" y2="40" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <line x1="145" y1="18" x2="145" y2="30" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <line x1="165" y1="12" x2="165" y2="36" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="6" x2="185" y2="42" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
      <line x1="205" y1="10" x2="205" y2="38" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <line x1="225" y1="15" x2="225" y2="33" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <text x="250" y="30" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">"Add 2 dark espresso packs to my cart"</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">voice-tool-orchestrator.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Edge AI Tool Call Schema (V8 Isolate)</text>
      <text y="42" fill="#38bdf8">export const</text>
      <text x="95" y="42" fill="#f1f5f9">CartTools = {</text>

      <text y="66" fill="#f1f5f9">  name:</text>
      <text x="50" y="66" fill="#34d399">'mutate_ecommerce_cart'</text>
      <text x="215" y="66" fill="#f1f5f9">,</text>

      <text y="90" fill="#f1f5f9">  parameters: {</text>
      <text y="112" fill="#f1f5f9">    action:</text>
      <text x="65" y="112" fill="#f59e0b">'add' | 'remove' | 'apply_coupon'</text>
      <text x="315" y="112" fill="#f1f5f9">,</text>

      <text y="134" fill="#f1f5f9">    sku:</text>
      <text x="45" y="134" fill="#a78bfa">'COFFEE-ESPRESSO-DARK'</text>
      <text x="215" y="134" fill="#f1f5f9">,</text>

      <text y="156" fill="#f1f5f9">    quantity:</text>
      <text x="80" y="156" fill="#38bdf8">2</text>
      <text x="92" y="156" fill="#f1f5f9">,</text>

      <text y="178" fill="#f1f5f9">    coupon:</text>
      <text x="68" y="178" fill="#94a3b8">null</text>
      <text y="200" fill="#f1f5f9">  }</text>
      <text y="222" fill="#f1f5f9">};</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Runtime Latency Breakdown</text>
      <text x="14" y="292" fill="#22d3ee">Speech-to-Text Stream:</text>
      <text x="220" y="292" fill="#f1f5f9">42 ms (In-Browser)</text>

      <text x="14" y="314" fill="#a78bfa">Edge Intent &amp; Tool Parse:</text>
      <text x="220" y="314" fill="#f1f5f9">88 ms (V8 Isolate)</text>

      <text x="14" y="336" fill="#34d399">Optimistic Cart Mutation:</text>
      <text x="220" y="336" fill="#f1f5f9">12 ms (React 19 Action)</text>
    </g>
  </g>
</svg>

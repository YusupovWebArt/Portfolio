<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="buhlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0a1226" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="amberGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="fintechCyanLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#buhlBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="300" cy="200" r="220" fill="#06B6D4" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="950" cy="320" r="260" fill="#10B981" opacity="0.07" filter="url(#glowFilter)" />

  <!-- Central Visual: Fintech Architectural Diagram -->
  <g transform="translate(620, 110)">
    <!-- Circuit Lines -->
    <path d="M -80 180 L 40 180 L 100 240 L 220 240" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
    <path d="M 220 240 L 320 240 L 360 200 L 440 200" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.4"/>
    
    <!-- Shield Container (BaFin / GDPR) -->
    <g transform="translate(140, 80)">
      <polygon points="120,20 220,60 220,180 120,240 20,180 20,60" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glowFilter)"/>
      <polygon points="120,40 200,75 200,170 120,220 40,170 40,75" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Lock Symbol -->
      <path d="M 100 130 H 140 V 165 H 100 Z" fill="#10B981"/>
      <path d="M 108 130 V 115 C 108 108 132 108 132 115 V 130" stroke="#10B981" stroke-width="3.5" fill="none"/>
      
      <!-- German Flag Subtle Pill -->
      <g transform="translate(75, 78)">
        <rect x="0" y="0" width="30" height="3" fill="#1A1A1A"/>
        <rect x="0" y="3" width="30" height="3" fill="#DD0000"/>
        <rect x="0" y="6" width="30" height="3" fill="#FFCE00"/>
      </g>
      <text x="112" y="86" fill="#94A3B8" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="1.5">DE MARKET</text>
    </g>

    <!-- Micro-cards floating -->
    <g transform="translate(-20, 240)">
      <rect width="180" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">PERFORMANCE</text>
      <text x="18" y="47" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="18">0.8s LCP / 98 Score</text>
    </g>

    <g transform="translate(260, 290)">
      <rect width="190" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">CMS ENGINE</text>
      <text x="18" y="47" fill="#06B6D4" font-family="sans-serif" font-weight="800" font-size="17">Zero-Builder WP PHP</text>
    </g>
  </g>

  <!-- Left Side: Editorial Typography & Badges -->
  <g transform="translate(80, 130)">
    <!-- Category & Status Badge -->
    <g>
      <rect width="210" height="32" rx="16" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4" fill="#06B6D4" />
      <text x="28" y="21" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0.5">FLAGSHIP CASE STUDY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#F8FAFC" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
      Buhl WISO Tax Software
    </text>
    <text x="0" y="145" fill="#38BDF8" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
      Custom WP, BaFin &amp; GDPR
    </text>

    <!-- Subtitle / Hook -->
    <text x="0" y="195" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      Zero-builder architecture engineered for high-conversion tax returns
    </text>
    <text x="0" y="222" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      with strict German regulatory data compliance and sub-second TTFB.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 275)">
      <g>
        <text x="0" y="0" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="800">98/100</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">PAGESPEED</text>
      </g>
      <g transform="translate(130, 0)">
        <text x="0" y="0" fill="#06B6D4" font-family="sans-serif" font-size="28" font-weight="800">&lt; 90ms</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">TTFB FRANKFURT</text>
      </g>
      <g transform="translate(280, 0)">
        <text x="0" y="0" fill="#F59E0B" font-family="sans-serif" font-size="28" font-weight="800">100%</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">GDPR &amp; BAFIN</text>
      </g>
    </g>

    <!-- Author & Proof Row -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">Artur Yusupov</text>
      <text x="110" y="0" fill="#64748B" font-family="sans-serif" font-size="14">•</text>
      <text x="125" y="0" fill="#94A3B8" font-family="sans-serif" font-size="14">Applied in Production: Buhl WISO Germany</text>
    </g>
  </g>
</svg>

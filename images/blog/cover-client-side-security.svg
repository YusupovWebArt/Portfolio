<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#091322" />
    </linearGradient>

    <!-- Glowing gradients -->
    <linearGradient id="shieldCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="shieldLimeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lockRedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glowSec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridSec" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#secBg)" />
  <rect width="1200" height="630" fill="url(#gridSec)" />

  <!-- Ambient light orbs -->
  <circle cx="340" cy="270" r="230" fill="#06b6d4" opacity="0.08" filter="url(#glowSec)" />
  <circle cx="860" cy="310" r="250" fill="#84cc16" opacity="0.08" filter="url(#glowSec)" />
  <circle cx="600" cy="170" r="190" fill="#3b82f6" opacity="0.07" filter="url(#glowSec)" />

  <!-- Central Security Operations Console Frame -->
  <g transform="translate(160, 85)">
    <!-- Main Console Frame -->
    <rect x="60" y="40" width="760" height="390" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
    <rect x="60" y="40" width="760" height="390" rx="24" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />

    <!-- Window Controls -->
    <circle cx="95" cy="72" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="115" cy="72" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="135" cy="72" r="5" fill="#10b981" opacity="0.8" />
    <line x1="160" y1="72" x2="330" y2="72" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left: Cryptographic Shield & CSP Firewall -->
    <g transform="translate(100, 110)">
      <rect x="0" y="0" width="310" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="310" height="180" rx="16" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25" />

      <!-- Shield Centerpiece -->
      <g transform="translate(115, 25)">
        <polygon points="40,5 75,20 75,60 40,85 5,60 5,20" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" filter="url(#glowSec)" />
        <polygon points="40,15 65,27 65,55 40,73 15,55 15,27" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
        <!-- Keyhole / Lock Core -->
        <circle cx="40" cy="40" r="7" fill="#84cc16" />
        <polygon points="37,42 43,42 45,54 35,54" fill="#84cc16" />
      </g>

      <!-- CSP Directives Visualization -->
      <g transform="translate(25, 125)">
        <line x1="0" y1="5" x2="260" y2="5" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
        <line x1="0" y1="5" x2="210" y2="5" stroke="url(#shieldCyanGlow)" stroke-width="4" stroke-linecap="round" filter="url(#glowSec)" />
        <line x1="0" y1="25" x2="180" y2="25" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
        <line x1="200" y1="25" x2="260" y2="25" stroke="#84cc16" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Right: Base64 Obfuscation & Bot Scraping Perimeter -->
    <g transform="translate(470, 110)">
      <rect x="0" y="0" width="310" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="310" height="180" rx="16" fill="none" stroke="#84cc16" stroke-width="1" stroke-opacity="0.25" />

      <!-- Obfuscation matrix streams -->
      <g transform="translate(25, 30)">
        <line x1="0" y1="10" x2="160" y2="10" stroke="#475569" stroke-width="2" stroke-linecap="round" />
        <rect x="180" y="0" width="80" height="22" rx="6" fill="#f43f5e" fill-opacity="0.15" />
        <line x1="195" y1="11" x2="245" y2="11" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

        <line x1="0" y1="40" x2="130" y2="40" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" />
        <path d="M 135 40 L 175 40" stroke="#84cc16" stroke-width="2" stroke-linecap="round" filter="url(#glowSec)" />
        <rect x="180" y="30" width="80" height="22" rx="6" fill="#84cc16" fill-opacity="0.15" />
        <line x1="195" y1="41" x2="245" y2="41" stroke="#84cc16" stroke-width="2" stroke-linecap="round" />

        <!-- Hash blocks -->
        <g transform="translate(0, 75)">
          <rect x="0" y="0" width="70" height="35" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
          <line x1="15" y1="17" x2="55" y2="17" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
          
          <line x1="70" y1="17" x2="95" y2="17" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
          <rect x="95" y="0" width="70" height="35" rx="6" fill="#0f172a" stroke="#84cc16" stroke-width="1.5" />
          <line x1="110" y1="17" x2="150" y2="17" stroke="#84cc16" stroke-width="2" stroke-linecap="round" />

          <line x1="165" y1="17" x2="190" y2="17" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="210" cy="17" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowSec)" />
          <path d="M 205 17 L 209 21 L 217 13" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>
    </g>

    <!-- Bottom: Threat Defense & Zero-Commit Verification Status -->
    <g transform="translate(100, 310)">
      <rect x="0" y="0" width="680" height="100" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
      
      <!-- Status pill 1 -->
      <g transform="translate(30, 25)">
        <circle cx="15" cy="25" r="8" fill="#10b981" filter="url(#glowSec)" />
        <line x1="35" y1="15" x2="160" y2="15" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
        <line x1="35" y1="35" x2="130" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Status pill 2 -->
      <g transform="translate(250, 25)">
        <circle cx="15" cy="25" r="8" fill="#06b6d4" filter="url(#glowSec)" />
        <line x1="35" y1="15" x2="170" y2="15" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
        <line x1="35" y1="35" x2="140" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Status pill 3 -->
      <g transform="translate(480, 25)">
        <circle cx="15" cy="25" r="8" fill="#84cc16" filter="url(#glowSec)" />
        <line x1="35" y1="15" x2="150" y2="15" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
        <line x1="35" y1="35" x2="120" y2="35" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
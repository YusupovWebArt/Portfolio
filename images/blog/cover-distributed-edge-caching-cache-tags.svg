    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">edge-cache-mesh-router.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Next.js 16 Tag Invalidation + Cloudflare Mesh</text>
      <text y="42" fill="#38bdf8">export async function</text>
      <text x="175" y="42" fill="#f1f5f9">invalidateCatalogTag(</text>
      <text x="350" y="42" fill="#fbbf24">tag</text>
      <text x="375" y="42" fill="#f1f5f9">) {</text>

      <text y="66" fill="#64748b">  // 1. Next.js App Router Data Cache purge</text>
      <text y="88" fill="#38bdf8">  revalidateTag</text>
      <text x="110" y="88" fill="#f1f5f9">(tag);</text>

      <text y="112" fill="#64748b">  // 2. Broadcast purge to 300+ Edge POPs</text>
      <text y="134" fill="#38bdf8">  const</text>
      <text x="45" y="134" fill="#f1f5f9">purgeRes =</text>
      <text x="135" y="134" fill="#38bdf8">await</text>
      <text x="180" y="134" fill="#f1f5f9">cloudflare.cache.purge({</text>

      <text y="156" fill="#f1f5f9">    tags: [</text>
      <text x="60" y="156" fill="#34d399">\`surrogate-sku:\${tag}\`</text>
      <text x="210" y="156" fill="#f1f5f9">]</text>

      <text y="178" fill="#f1f5f9">  });</text>
      <text y="200" fill="#38bdf8">  return</text>
      <text x="50" y="200" fill="#f1f5f9">{ purged: true, latencyMs: 68 };</text>
      <text y="222" fill="#f1f5f9">}</text>

      <rect y="246" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="270" fill="#64748b">// Mesh Propagation Metrics</text>
      <text x="14" y="292" fill="#c084fc">Global POP Propagation:</text>
      <text x="185" y="292" fill="#f1f5f9">68 ms Worldwide</text>

      <text x="14" y="314" fill="#38bdf8">Thundering Herd Risk:</text>
      <text x="185" y="314" fill="#f1f5f9">0% (SWR Mutex Guard)</text>

      <text x="14" y="336" fill="#10b981">Origin Compute Offload:</text>
      <text x="185" y="336" fill="#f1f5f9">98.4% Requests at Edge</text>

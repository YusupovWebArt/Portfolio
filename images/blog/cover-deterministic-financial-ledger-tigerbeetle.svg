<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a16"/>
      <stop offset="50%" stop-color="#0f1526"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="fintechGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#f59e0b" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="180" r="160" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="610" cy="310" r="210" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="360" height="34" rx="17" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1.5">FINANCIAL LEDGER &amp; FINTECH 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">TigerBeetle &amp; Ledger</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#fintechGlow)" letter-spacing="-0.5">Double-Entry Engine</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">128-Bit Integer Math, Viewstamped Replication, Two-Phase Transfers</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Temporal Durable Payment Sagas in Next.js 16 App Router</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">COMMIT LATENCY</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fbbf24">&lt; 800 us</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">LEDGER IMBALANCE</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">0.00% Zero</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">THROUGHPUT</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">1M tx/sec</text>
    </g>

    <!-- Tech Stack Pill Bar -->
    <g transform="translate(0, 355)">
      <rect width="90" height="26" rx="13" fill="#1e293b"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Next.js 16</text>

      <rect x="100" width="100" height="26" rx="13" fill="#1e293b"/>
      <text x="114" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TigerBeetle</text>

      <rect x="210" width="90" height="26" rx="13" fill="#1e293b"/>
      <text x="224" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Temporal</text>

      <rect x="310" width="105" height="26" rx="13" fill="#1e293b"/>
      <text x="324" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Double-Entry</text>

      <rect x="425" width="85" height="26" rx="13" fill="#1e293b"/>
      <text x="439" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TypeScript</text>
    </g>
  </g>

  <!-- Right: Double-Entry Balancing & State Machine View -->
  <g transform="translate(680, 75)">
    <!-- Main Frame -->
    <rect width="450" height="480" rx="20" fill="#0d111d" stroke="#1e293b" stroke-width="2"/>

    <!-- Window Header -->
    <circle cx="28" cy="28" r="6" fill="#ef4444"/>
    <circle cx="48" cy="28" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="28" r="6" fill="#10b981"/>
    <text x="92" y="32" font-family="monospace" font-size="11" fill="#64748b">tigerbeetle-ledger-core.ts</text>

    <!-- Node 1: Double-Entry Equation Balance Invariant -->
    <g transform="translate(30, 60)">
      <rect width="390" height="70" rx="12" fill="#141a29" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="24" cy="35" r="10" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="20" y="39" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24">=</text>
      <text x="45" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Double-Entry Balance Invariant</text>
      <text x="45" y="47" font-family="monospace" font-size="11" fill="#fbbf24">Sum(Debits) - Sum(Credits) == 0 (Strict 128-Bit)</text>
      <rect x="315" y="23" width="60" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="325" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#fbbf24">BALANCED</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M225,130 V150" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,155 221,147 229,147" fill="#10b981"/>

    <!-- Node 2: Two-Phase Transfer Engine (Pending -> Posted) -->
    <g transform="translate(30, 160)">
      <rect width="390" height="70" rx="12" fill="#0c1d18" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="24" cy="35" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="20" y="39" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">2P</text>
      <text x="45" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">TigerBeetle Two-Phase Transfers</text>
      <text x="45" y="47" font-family="monospace" font-size="11" fill="#6ee7b7">Phase 1: Pending Auth -&gt; Phase 2: Post / Void</text>
      <rect x="315" y="23" width="60" height="22" rx="11" fill="#10b981" fill-opacity="0.15"/>
      <text x="328" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#34d399">VSR OK</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M225,230 V250" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,255 221,247 229,247" fill="#06b6d4"/>

    <!-- Node 3: Temporal Workflow Saga Orchestration -->
    <g transform="translate(30, 260)">
      <rect width="390" height="75" rx="12" fill="#081824" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="24" cy="37" r="10" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="20" y="41" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">W</text>
      <text x="45" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Temporal Durable Execution Workflow</text>
      <text x="45" y="47" font-family="monospace" font-size="11" fill="#7dd3fc">Execute Payment Activity -&gt; Await Webhook -&gt; Post Ledger</text>
      <rect x="305" y="25" width="70" height="22" rx="11" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="318" y="40" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8">TEMPORAL</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M225,335 V355" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,360 221,352 229,352" fill="#a78bfa"/>

    <!-- Node 4: Next.js 16 Server Action & Idempotency Key -->
    <g transform="translate(30, 365)">
      <rect width="390" height="85" rx="12" fill="#131428" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="10" fill="#a78bfa" fill-opacity="0.2"/>
      <text x="20" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#c084fc">K</text>
      <text x="45" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Next.js 16 Server Action (Idempotency Key)</text>
      <text x="45" y="45" font-family="monospace" font-size="11" fill="#c4b5fd">Deduplication: UUIDv7 transfer id with zero collisions</text>
      <text x="45" y="63" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8">Zero Floating Point Errors | Direct I/O Ring Buffers</text>
    </g>
  </g>
</svg>

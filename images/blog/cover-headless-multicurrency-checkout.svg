<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
<!-- Background Gradient -->
<linearGradient id="fintechBg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#040914" />
<stop offset="50%" stop-color="#071226" />
<stop offset="100%" stop-color="#0b1736" />
</linearGradient>
<!-- Accent Gradients -->
<linearGradient id="stripePurple" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#6366f1" stop-opacity="0.95" />
<stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
</linearGradient>
<linearGradient id="emeraldSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
<stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
</linearGradient>
<linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
<stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
</linearGradient>
<filter id="glowCheckout" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="8" result="blur" />
<feMerge>
<feMergeNode in="blur" />
<feMergeNode in="SourceGraphic" />
</feMerge>
</filter>
<pattern id="gridCheckout" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
</pattern>
</defs>
<!-- Background Layer -->
<rect width="1200" height="630" fill="url(#fintechBg)" />
<rect width="1200" height="630" fill="url(#gridCheckout)" />
<!-- Ambient Light Orbs -->
<circle cx="280" cy="220" r="230" fill="#6366f1" opacity="0.08" filter="url(#glowCheckout)" />
<circle cx="920" cy="260" r="250" fill="#10b981" opacity="0.09" filter="url(#glowCheckout)" />
<circle cx="600" cy="180" r="190" fill="#00f0ff" opacity="0.07" filter="url(#glowCheckout)" />
<!-- Central E-Commerce Console Frame -->
<g transform="translate(160, 80)">
<!-- Main Console Frame -->
<rect x="40" y="30" width="800" height="410" rx="24" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" opacity="0.96" />
<rect x="40" y="30" width="800" height="410" rx="24" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.35" />
<!-- Window Controls -->
<circle cx="75" cy="62" r="5" fill="#f43f5e" opacity="0.8" />
<circle cx="95" cy="62" r="5" fill="#eab308" opacity="0.8" />
<circle cx="115" cy="62" r="5" fill="#10b981" opacity="0.8" />
<line x1="140" y1="62" x2="380" y2="62" stroke="#334155" stroke-width="2" stroke-linecap="round" />
<!-- Header Badge -->
<rect x="510" y="50" width="310" height="24" rx="6" fill="#1e293b" />
<text x="665" y="66" fill="#00f0ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">HEADLESS CHECKOUT &amp; STRIPE ENGINE</text>
<!-- Left Box: Client Interaction & Edge Tax -->
<g transform="translate(70, 95)">
<rect width="210" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
<rect x="15" y="15" width="180" height="28" rx="6" fill="#1e293b" />
<text x="105" y="33" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CLIENT &amp; EDGE TAX</text>
<text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Next.js 16 UI</text>
<text x="190" y="70" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">Optimistic</text>
<text x="20" y="98" fill="#94a3b8" font-family="monospace" font-size="11">EU VAT OSS Tax</text>
<text x="190" y="98" fill="#00f0ff" font-family="monospace" font-size="11" text-anchor="end">&lt; 42ms Edge</text>
<text x="20" y="126" fill="#94a3b8" font-family="monospace" font-size="11">US State Tax</text>
<text x="190" y="126" fill="#00f0ff" font-family="monospace" font-size="11" text-anchor="end">Sub-50ms</text>
<text x="20" y="154" fill="#94a3b8" font-family="monospace" font-size="11">Input Blocking</text>
<text x="190" y="154" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">ZERO LOCK</text>
<path d="M 20 178 L 190 178" stroke="#1e293b" stroke-width="1" />
<circle cx="28" cy="202" r="4" fill="#10b981" />
<text x="40" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Minor Units: Integer Math</text>
</g>
<!-- Flow Arrow 1 -->
<path d="M 285 210 L 325 210" stroke="url(#cyanBlue)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
<polygon points="328,210 320,205 320,215" fill="#00f0ff" />
<!-- Center Box: Stripe Elements Multi-Currency Gateway -->
<g transform="translate(335, 85)">
<rect width="210" height="250" rx="16" fill="#091428" stroke="#6366f1" stroke-width="1.8" />
<!-- Payment Card & Badges Header -->
<rect x="55" y="25" width="100" height="60" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
<rect x="65" y="40" width="30" height="8" rx="2" fill="#6366f1" />
<circle cx="135" cy="44" r="8" fill="#eab308" opacity="0.8" />
<circle cx="143" cy="44" r="8" fill="#f43f5e" opacity="0.8" />
<!-- Currency Badges -->
<rect x="35" y="98" width="40" height="20" rx="4" fill="#1e293b" />
<text x="55" y="112" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">EUR</text>
<rect x="85" y="98" width="40" height="20" rx="4" fill="#1e293b" />
<text x="105" y="112" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">USD</text>
<rect x="135" y="98" width="40" height="20" rx="4" fill="#1e293b" />
<text x="155" y="112" fill="#a855f7" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">GBP</text>
<text x="105" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Stripe Elements</text>
<text x="105" y="165" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Unified Payment Intents</text>
<rect x="20" y="182" width="170" height="26" rx="6" fill="#1e293b" />
<text x="105" y="199" fill="#10b981" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Apple Pay / Klarna / iDEAL</text>
<rect x="20" y="214" width="170" height="26" rx="6" fill="#1e293b" />
<text x="105" y="231" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PCI DSS Scope: SAQ A</text>
</g>
<!-- Flow Arrow 2 -->
<path d="M 550 210 L 590 210" stroke="url(#emeraldSuccess)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
<polygon points="593,210 585,205 585,215" fill="#10b981" />
<!-- Right Box: Asynchronous Webhook & WooCommerce HPOS -->
<g transform="translate(600, 95)">
<rect width="210" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
<rect x="15" y="15" width="180" height="28" rx="6" fill="#1e293b" />
<text x="105" y="33" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EVENT-DRIVEN BACKEND</text>
<text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Stripe Webhook</text>
<text x="190" y="70" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">HMAC-SHA256</text>
<text x="20" y="98" fill="#94a3b8" font-family="monospace" font-size="11">Idempotency Key</text>
<text x="190" y="98" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">Redis SETNX</text>
<text x="20" y="126" fill="#94a3b8" font-family="monospace" font-size="11">Woo HPOS Order</text>
<text x="190" y="126" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">Async Queue</text>
<text x="20" y="154" fill="#94a3b8" font-family="monospace" font-size="11">DB Deadlocks</text>
<text x="190" y="154" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">0 DEADLOCKS</text>
<path d="M 20 178 L 190 178" stroke="#1e293b" stroke-width="1" />
<circle cx="28" cy="202" r="4" fill="#10b981" />
<text x="40" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Zero Cart Abandonment</text>
</g>
<!-- Bottom Telemetry Badges -->
<g transform="translate(60, 360)">
<rect width="160" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="80" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">EDGE TAX LOOKUP</text>
<text x="80" y="42" fill="#00f0ff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">&lt; 42ms LATENCY</text>
</g>
<g transform="translate(245, 360)">
<rect width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="90" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CART DROP-OFF RELIEF</text>
<text x="90" y="42" fill="#10b981" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">-24.6% DROP</text>
</g>
<g transform="translate(450, 360)">
<rect width="170" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="85" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PEAK CONCURRENCY</text>
<text x="85" y="42" fill="#10b981" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">850 REQ / SEC</text>
</g>
<g transform="translate(645, 360)">
<rect width="165" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="82" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SECURITY SCOPE</text>
<text x="82" y="42" fill="#a855f7" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">SAQ A ISOLATED</text>
</g>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0c0a1a" />
    </linearGradient>

    <!-- Glowing gradients -->
    <linearGradient id="shopAmberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="shopVioletGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="shopEmeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glowShop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridShop" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#shopBg)" />
  <rect width="1200" height="630" fill="url(#gridShop)" />

  <!-- Ambient light orbs -->
  <circle cx="320" cy="280" r="220" fill="#f59e0b" opacity="0.08" filter="url(#glowShop)" />
  <circle cx="860" cy="300" r="240" fill="#8b5cf6" opacity="0.09" filter="url(#glowShop)" />
  <circle cx="590" cy="180" r="180" fill="#10b981" opacity="0.06" filter="url(#glowShop)" />

  <!-- Central Dual-Architecture Console Frame -->
  <g transform="translate(160, 85)">
    <!-- Main Console Frame -->
    <rect x="60" y="40" width="760" height="390" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
    <rect x="60" y="40" width="760" height="390" rx="24" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />

    <!-- Window Controls -->
    <circle cx="95" cy="72" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="115" cy="72" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="135" cy="72" r="5" fill="#10b981" opacity="0.8" />
    <line x1="160" y1="72" x2="330" y2="72" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left Column: Shopify Liquid Edge Infrastructure -->
    <g transform="translate(100, 110)">
      <rect x="0" y="0" width="310" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="310" height="180" rx="16" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

      <!-- Shopify Edge Pipeline Header -->
      <circle cx="30" cy="30" r="10" fill="#10b981" />
      <line x1="50" y1="30" x2="160" y2="30" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <rect x="220" y="18" width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
      <line x1="235" y1="29" x2="275" y2="29" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

      <!-- Edge Checkout Nodes -->
      <g transform="translate(25, 60)">
        <rect x="0" y="0" width="60" height="45" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <line x1="15" y1="22" x2="45" y2="22" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

        <line x1="60" y1="22" x2="95" y2="22" stroke="#334155" stroke-width="2" stroke-linecap="round" />
        <rect x="95" y="0" width="65" height="45" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
        <line x1="110" y1="22" x2="145" y2="22" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

        <line x1="160" y1="22" x2="195" y2="22" stroke="#334155" stroke-width="2" stroke-linecap="round" />
        <rect x="195" y="0" width="65" height="45" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowShop)" />
        <path d="M 220 22 L 227 28 L 240 16" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Conversion & API latency bar -->
      <line x1="25" y1="135" x2="285" y2="135" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="25" y1="135" x2="255" y2="135" stroke="url(#shopEmeraldGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glowShop)" />
      <circle cx="255" cy="135" r="4" fill="#34d399" />
      <line x1="25" y1="155" x2="140" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Right Column: Custom WooCommerce & WordPress Architecture -->
    <g transform="translate(470, 110)">
      <rect x="0" y="0" width="310" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="310" height="180" rx="16" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />

      <!-- WooCommerce Header -->
      <circle cx="30" cy="30" r="10" fill="#8b5cf6" />
      <line x1="50" y1="30" x2="170" y2="30" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
      <rect x="220" y="18" width="70" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.15" />
      <line x1="235" y1="29" x2="275" y2="29" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />

      <!-- MySQL / Database & Custom Hook Nodes -->
      <g transform="translate(25, 60)">
        <rect x="0" y="0" width="60" height="45" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
        <ellipse cx="30" cy="18" rx="16" ry="6" fill="none" stroke="#a78bfa" stroke-width="1.5" />
        <ellipse cx="30" cy="27" rx="16" ry="6" fill="none" stroke="#a78bfa" stroke-width="1.5" />

        <line x1="60" y1="22" x2="95" y2="22" stroke="#334155" stroke-width="2" stroke-linecap="round" />
        <rect x="95" y="0" width="65" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
        <line x1="110" y1="22" x2="145" y2="22" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />

        <line x1="160" y1="22" x2="195" y2="22" stroke="#334155" stroke-width="2" stroke-linecap="round" />
        <rect x="195" y="0" width="65" height="45" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glowShop)" />
        <polygon points="227,14 238,32 216,32" fill="none" stroke="#a78bfa" stroke-width="2" />
      </g>

      <!-- Flexibility & TCO Index -->
      <line x1="25" y1="135" x2="285" y2="135" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
      <line x1="25" y1="135" x2="220" y2="135" stroke="url(#shopVioletGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glowShop)" />
      <circle cx="220" cy="135" r="4" fill="#ec4899" />
      <line x1="25" y1="155" x2="140" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Bottom Row: TCO Matrix & Decision Engine -->
    <g transform="translate(100, 310)">
      <rect x="0" y="0" width="680" height="100" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
      
      <!-- Metric column 1: Checkout Speed -->
      <g transform="translate(30, 25)">
        <line x1="0" y1="5" x2="100" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="120" y2="25" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="80" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Metric column 2: Monthly TCO -->
      <g transform="translate(230, 25)">
        <line x1="0" y1="5" x2="110" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="140" y2="25" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="90" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Metric column 3: Customization Freedom -->
      <g transform="translate(450, 25)">
        <line x1="0" y1="5" x2="120" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="150" y2="25" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="100" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
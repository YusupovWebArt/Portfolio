<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#060d19"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="220" cy="180" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="180" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="610" cy="310" r="210" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="330" height="34" rx="17" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.5">DEVSECOPS &amp; AI QUALITY 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Autonomous AI</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#aiGlow)" letter-spacing="-0.5">Quality Harness</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Spec-Driven Development (SDD), AST Invariant Enforcement</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Self-Healing Vitest Suites in Next.js 16 Codebases</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">SPEC STATE GATES</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">100% Gated</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">AST INVARIANTS</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">Zero Drift</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">HEALING SPEED</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#818cf8">&lt; 1.8s Loop</text>
    </g>

    <!-- Visual Architecture Status Node -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="24" r="5" fill="#10b981"/>
      <text x="44" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">SDD Pipeline: Spec -> Plan -> AST Check -> Self-Healing Test</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">ast-invariant-guard.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// TypeScript Compiler API: enforce AST invariants</text>
      <text y="42" fill="#38bdf8">export function</text>
      <text x="135" y="42" fill="#f1f5f9">verifyAstInvariants(</text>
      <text x="290" y="42" fill="#fbbf24">source</text>
      <text x="335" y="42" fill="#f1f5f9">) {</text>

      <text y="66" fill="#f1f5f9">  ts.forEachChild(source, (</text>
      <text x="200" y="66" fill="#fbbf24">node</text>
      <text x="235" y="66" fill="#f1f5f9">) =&gt; {</text>

      <text y="92" fill="#38bdf8">    if</text>
      <text x="25" y="92" fill="#f1f5f9">(node.kind === ts.SyntaxKind.AnyKeyword) {</text>
      <text y="114" fill="#ef4444">      throw new AstViolationError('Strict Zero-Any');</text>
      <text y="136" fill="#f1f5f9">    }</text>

      <text y="160" fill="#38bdf8">    if</text>
      <text x="25" y="160" fill="#f1f5f9">(isEmDashInLiteral(node)) {</text>
      <text y="182" fill="#ef4444">      throw new AstViolationError('Forbidden Em Dash');</text>
      <text y="204" fill="#f1f5f9">    }</text>

      <text y="226" fill="#f1f5f9">  });</text>
      <text y="246" fill="#f1f5f9">}</text>

      <rect y="262" width="402" height="96" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="286" fill="#64748b">// Quality Harness Report</text>
      <text x="14" y="308" fill="#34d399">Spec Gating:</text>
      <text x="155" y="308" fill="#f1f5f9">All 5 Phases Validated</text>

      <text x="14" y="328" fill="#38bdf8">AST Boundary:</text>
      <text x="155" y="328" fill="#f1f5f9">0 Architectural Drifts</text>

      <text x="14" y="348" fill="#818cf8">Vitest Healing:</text>
      <text x="155" y="348" fill="#f1f5f9">Passed 100% Deterministic</text>
    </g>
  </g>
</svg>

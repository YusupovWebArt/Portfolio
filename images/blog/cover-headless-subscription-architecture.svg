<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="50%" stop-color="#0d142b"/>
      <stop offset="100%" stop-color="#070c1d"/>
    </linearGradient>
    <linearGradient id="stripeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="170" r="150" fill="#6366f1" opacity="0.09" filter="url(#glow)"/>
  <circle cx="970" cy="440" r="170" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="590" cy="320" r="220" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="330" height="34" rx="17" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="1.5">SAAS &amp; FINTECH BILLING 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Headless Subscription</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#stripeGlow)" letter-spacing="-0.5">Architecture &amp; Billing</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Usage-Based Metering, Mid-Cycle Prorations</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Automated Dunning Webhooks in Next.js 16</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">METER EVENTS</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#818cf8">100k / sec</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">PRORATION ACCURACY</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22d3ee">100% Deterministic</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">CHURN RECOVERY</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">+ 24.8% Retained</text>
    </g>

    <!-- Visual Metering Gauge Bar -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="320" height="16" rx="4" fill="#1e293b"/>
      <rect x="16" y="16" width="230" height="16" rx="4" fill="url(#stripeGlow)"/>
      <text x="350" y="28" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">Meter: 71,840 / 100,000</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">stripe-proration-engine.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Real-time mid-cycle proration preview</text>
      <text y="42" fill="#38bdf8">const</text>
      <text x="45" y="42" fill="#f1f5f9">preview =</text>
      <text x="115" y="42" fill="#38bdf8">await</text>
      <text x="160" y="42" fill="#f1f5f9">stripe.invoices.createPreview({</text>

      <text y="66" fill="#f1f5f9">  customer:</text>
      <text x="75" y="66" fill="#34d399">'cus_enterprise_992'</text>
      <text x="235" y="66" fill="#f1f5f9">,</text>

      <text y="90" fill="#f1f5f9">  subscription:</text>
      <text x="105" y="90" fill="#34d399">'sub_live_annual'</text>
      <text x="235" y="90" fill="#f1f5f9">,</text>

      <text y="112" fill="#f1f5f9">  items: [{</text>
      <text y="134" fill="#f1f5f9">    id:</text>
      <text x="35" y="134" fill="#34d399">'si_scale_tier'</text>
      <text x="145" y="134" fill="#f1f5f9">,</text>

      <text y="156" fill="#f1f5f9">    price:</text>
      <text x="55" y="156" fill="#a78bfa">'price_pro_unlimited'</text>

      <text y="178" fill="#f1f5f9">  }],</text>
      <text y="200" fill="#f1f5f9">  proration_behavior:</text>
      <text x="155" y="200" fill="#f59e0b">'always_invoice'</text>

      <text y="222" fill="#f1f5f9">});</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Webhook BullMQ Dunning Queue</text>
      <text x="14" y="292" fill="#ef4444">invoice.payment_failed:</text>
      <text x="210" y="292" fill="#f1f5f9">Grace Period Active (7d)</text>

      <text x="14" y="314" fill="#f59e0b">Smart Retry Attempt:</text>
      <text x="210" y="314" fill="#f1f5f9">Backoff Exp (12h, 24h, 48h)</text>

      <text x="14" y="336" fill="#10b981">Dunning Status:</text>
      <text x="210" y="336" fill="#f1f5f9">Zero Involuntary Drop</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hposBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f1124" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleRedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="emeraldLimeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="redisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#hposBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="260" cy="220" r="240" fill="#9333ea" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="940" cy="260" r="260" fill="#10b981" opacity="0.09" filter="url(#glowFilter)" />
  <circle cx="600" cy="190" r="200" fill="#ef4444" opacity="0.07" filter="url(#glowFilter)" />

  <!-- Central Architecture Console Frame -->
  <g transform="translate(160, 80)">
    <!-- Main Console Frame -->
    <rect x="40" y="30" width="800" height="410" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.96" />
    <rect x="40" y="30" width="800" height="410" rx="24" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" />

    <!-- Window Controls -->
    <circle cx="75" cy="62" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="95" cy="62" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="115" cy="62" r="5" fill="#10b981" opacity="0.8" />
    <line x1="140" y1="62" x2="380" y2="62" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left Box: WooCommerce HPOS Layer -->
    <g transform="translate(75, 105)">
      <rect width="205" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="15" y="15" width="175" height="32" rx="8" fill="#0f172a" />
      <text x="102" y="36" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">WOOCOMMERCE HPOS</text>

      <!-- Tables Stack -->
      <g transform="translate(15, 60)">
        <rect width="175" height="40" rx="8" fill="#090d16" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">wp_wc_orders</text>
        <text x="160" y="24" fill="#10b981" font-family="system-ui" font-size="9" text-anchor="end">INDEXED</text>
      </g>

      <g transform="translate(15, 108)">
        <rect width="175" height="40" rx="8" fill="#090d16" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">wp_wc_order_addresses</text>
      </g>

      <g transform="translate(15, 156)">
        <rect width="175" height="40" rx="8" fill="#090d16" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="600">wp_wc_operational_data</text>
      </g>

      <g transform="translate(15, 204)">
        <rect width="175" height="40" rx="8" fill="#090d16" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" fill="#94a3b8" font-family="monospace" font-size="11">wp_wc_orders_meta</text>
        <text x="160" y="24" fill="#38bdf8" font-family="system-ui" font-size="9" text-anchor="end">ISOLATED</text>
      </g>

      <rect x="15" y="252" width="175" height="18" rx="4" fill="#10b981" fill-opacity="0.12" />
      <text x="102" y="264" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">0 DEADLOCKS (MUTEX FREE)</text>
    </g>

    <!-- Center Box: Redis Persistent Object Cache -->
    <g transform="translate(325, 105)">
      <rect width="215" height="280" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="15" y="15" width="185" height="32" rx="8" fill="#450a0a" />
      <text x="107" y="36" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">REDIS OBJECT CACHE</text>

      <g transform="translate(15, 60)">
        <rect width="185" height="58" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Persistent In-Memory RAM</text>
        <text x="12" y="44" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="700">&lt; 1.8ms</text>
        <text x="80" y="44" fill="#64748b" font-family="system-ui" font-size="10">Query Hit Latency</text>
      </g>

      <g transform="translate(15, 126)">
        <rect width="185" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Ignored Groups Isolation</text>
        <text x="12" y="40" fill="#38bdf8" font-family="monospace" font-size="10">wc_session_id / cart</text>
      </g>

      <g transform="translate(15, 188)">
        <rect width="185" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Eviction Policy</text>
        <text x="12" y="40" fill="#a3e635" font-family="monospace" font-size="10">volatile-lru (Safe)</text>
      </g>

      <rect x="15" y="250" width="185" height="20" rx="4" fill="#ef4444" fill-opacity="0.15" />
      <text x="107" y="264" fill="#f87171" font-family="monospace" font-size="9" text-anchor="middle">DROP-IN: object-cache.php</text>
    </g>

    <!-- Right Box: Checkout Performance Metrics -->
    <g transform="translate(580, 105)">
      <rect width="210" height="280" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="15" y="15" width="180" height="32" rx="8" fill="#064e3b" />
      <text x="105" y="36" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SUB-SECOND CHECKOUT</text>

      <g transform="translate(15, 60)">
        <rect width="180" height="62" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">P95 Checkout Latency</text>
        <text x="12" y="48" fill="#34d399" font-family="monospace" font-size="20" font-weight="700">420ms</text>
        <text x="90" y="48" fill="#64748b" font-family="system-ui" font-size="11">(-89% time)</text>
      </g>

      <g transform="translate(15, 130)">
        <rect width="180" height="62" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Concurrent Throughput</text>
        <text x="12" y="48" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700">&gt; 150</text>
        <text x="65" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">orders/min (8.4x)</text>
      </g>

      <g transform="translate(15, 200)">
        <rect width="180" height="65" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Catalog Scaling</text>
        <text x="12" y="48" fill="#facc15" font-family="monospace" font-size="18" font-weight="700">10,000+</text>
        <text x="90" y="48" fill="#94a3b8" font-family="system-ui" font-size="10">SKU scale</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges / Tech Stack Line -->
  <g transform="translate(200, 535)">
    <!-- Badge 1: WooCommerce HPOS -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#7e22ce" stroke-width="1" />
    <text x="82" y="20" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WOOCOMMERCE HPOS</text>

    <!-- Badge 2: Redis In-Memory -->
    <rect x="180" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#dc2626" stroke-width="1" />
    <text x="262" y="20" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">REDIS OBJECT CACHE</text>

    <!-- Badge 3: 10,000+ SKUs -->
    <rect x="360" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#ca8a04" stroke-width="1" />
    <text x="427" y="20" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">10,000+ SKUs</text>

    <!-- Badge 4: Sub-Second Checkout -->
    <rect x="510" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#059669" stroke-width="1" />
    <text x="595" y="20" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SUB-SECOND CHECKOUT</text>

    <!-- Author Pill -->
    <rect x="695" y="0" width="115" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="752" y="20" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">ARTUR YUSUPOV</text>
  </g>
</svg>

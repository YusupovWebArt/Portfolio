<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="260" fill="#10b981" opacity="0.10" filter="url(#glow)" />
  <circle cx="920" cy="380" r="280" fill="#38bdf8" opacity="0.10" filter="url(#glow)" />
  <circle cx="620" cy="180" r="220" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Left Main Card: Context Caching Architecture -->
  <g transform="translate(100, 85)">
    <!-- Outer Card Frame -->
    <rect width="580" height="460" rx="20" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="580" height="54" rx="20" fill="#0f172a" fill-opacity="0.9" />
    <path d="M 0 54 L 580 54" stroke="#1e293b" stroke-width="1" />
    <circle cx="34" cy="27" r="6" fill="#ef4444" />
    <circle cx="54" cy="27" r="6" fill="#f59e0b" />
    <circle cx="74" cy="27" r="6" fill="#10b981" />
    <text x="100" y="33" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">LLMOPS / PRODUCTION COST OPTIMIZATION</text>

    <!-- Header Badge -->
    <g transform="translate(35, 75)">
      <rect width="250" height="30" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <text x="16" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">GEMINI 2.5 &amp; CLAUDE 3.7</text>
    </g>

    <!-- Main Title -->
    <text x="35" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">Context Caching Engineering</text>
    <text x="35" y="180" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="600">-80% Token Billing &amp; Sub-500ms TTFT</text>

    <!-- Comparison Diagram: Standard vs Cached Flow -->
    <g transform="translate(35, 215)">
      <rect x="0" y="0" width="510" height="115" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      
      <!-- Standard Request (Expensive) -->
      <g transform="translate(18, 18)">
        <text x="0" y="12" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WITHOUT CACHING (FULL RECOMPUTE)</text>
        <rect x="0" y="22" width="220" height="14" rx="4" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="0.8" />
        <text x="8" y="33" fill="#fca5a5" font-family="monospace" font-size="9">128k Tokens: $0.384 / req</text>
        <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Latency: 3,200ms TTFT</text>
      </g>

      <!-- Divider line -->
      <path d="M 255 15 L 255 100" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3" />

      <!-- Cached Request (Optimized) -->
      <g transform="translate(275, 18)">
        <text x="0" y="12" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WITH PREFIX KV-CACHE (80% SAVINGS)</text>
        <rect x="0" y="22" width="215" height="14" rx="4" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.8" />
        <text x="8" y="33" fill="#86efac" font-family="monospace" font-size="9">Cached: $0.076 / req (-80%)</text>
        <text x="0" y="58" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Latency: 420ms TTFT (-87%)</text>
      </g>
    </g>

    <!-- Key Metrics Triple Grid -->
    <g transform="translate(35, 350)">
      <rect x="0" y="0" width="510" height="80" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(25, 20)">
        <text x="0" y="16" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="800">-80%</text>
        <text x="0" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">API Input Cost</text>
      </g>
      <g transform="translate(195, 20)">
        <text x="0" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">420 ms</text>
        <text x="0" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Time-to-First-Token</text>
      </g>
      <g transform="translate(365, 20)">
        <text x="0" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">1 Hour+</text>
        <text x="0" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dynamic TTL Life</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Cache KV Memory Visualization -->
  <g transform="translate(720, 85)">
    <!-- Right Panel Frame -->
    <rect width="380" height="460" rx="20" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="380" height="54" rx="20" fill="#0f172a" fill-opacity="0.9" />
    <path d="M 0 54 L 380 54" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="33" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">KV-CACHE MEMORY HIERARCHY</text>

    <!-- Memory Blocks Representation -->
    <g transform="translate(25, 75)">
      <!-- System Prompt & KB Block (CACHED) -->
      <rect width="330" height="85" rx="10" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" />
      <g transform="translate(16, 20)">
        <text x="0" y="10" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">[CACHE HIT: 98,400 TOKENS]</text>
        <text x="0" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Static RAG Knowledge Base &amp; Rules</text>
        <text x="0" y="48" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">Reused across all concurrent user turns</text>
      </g>

      <!-- Breakpoint Marker -->
      <g transform="translate(0, 100)">
        <path d="M 10 0 L 320 0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
        <rect x="90" y="-12" width="150" height="24" rx="6" fill="#0284c7" />
        <text x="100" y="4" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">cache_control: ephemeral</text>
      </g>

      <!-- Dynamic Query Block (UNCACHED) -->
      <g transform="translate(0, 125)">
        <rect width="330" height="85" rx="10" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1" />
        <g transform="translate(16, 20)">
          <text x="0" y="10" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700">[INPUT DELTA: 180 TOKENS]</text>
          <text x="0" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">User Prompt &amp; Dynamic Conversation</text>
          <text x="0" y="48" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10">Billed at standard un-cached rates</text>
        </g>
      </g>
    </g>

    <!-- Live Cost Savings Dashboard -->
    <g transform="translate(25, 315)">
      <rect width="330" height="115" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PRODUCTION SAVINGS ESTIMATE</text>
      <text x="18" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 10,000 queries/mo: $3,840 -> $768</text>
      <text x="18" y="74" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• Net Savings: $3,072 / month</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Invalidation Trigger: Automatic on Git push</text>
    </g>
  </g>
</svg>

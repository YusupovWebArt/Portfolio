<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="edtechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0c1022" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="violetPurpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="limeCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#edtechBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="240" fill="#8B5CF6" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="940" cy="300" r="260" fill="#06B6D4" opacity="0.07" filter="url(#glowFilter)" />

  <!-- Central Visual: Audio Waves & EdTech Console -->
  <g transform="translate(640, 140)">
    <!-- Audio Waveform Graphic -->
    <g transform="translate(60, 60)">
      <rect x="0" y="80" width="8" height="40" rx="4" fill="#8B5CF6" opacity="0.6"/>
      <rect x="18" y="50" width="8" height="100" rx="4" fill="#8B5CF6" opacity="0.8"/>
      <rect x="36" y="30" width="8" height="140" rx="4" fill="#A855F7"/>
      <rect x="54" y="10" width="8" height="180" rx="4" fill="#06B6D4"/>
      <rect x="72" y="40" width="8" height="120" rx="4" fill="#10B981"/>
      <rect x="90" y="70" width="8" height="60" rx="4" fill="#10B981" opacity="0.7"/>
      <rect x="108" y="20" width="8" height="160" rx="4" fill="#06B6D4"/>
      <rect x="126" y="50" width="8" height="100" rx="4" fill="#8B5CF6"/>
      <rect x="144" y="35" width="8" height="130" rx="4" fill="#A855F7"/>
      <rect x="162" y="80" width="8" height="40" rx="4" fill="#8B5CF6" opacity="0.5"/>
    </g>

    <!-- German Market Badge -->
    <g transform="translate(260, 40)">
      <rect width="140" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <g transform="translate(14, 11)">
        <rect x="0" y="0" width="16" height="3" fill="#1A1A1A"/>
        <rect x="0" y="3" width="16" height="3" fill="#DD0000"/>
        <rect x="0" y="6" width="16" height="3" fill="#FFCE00"/>
      </g>
      <text x="38" y="21" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700">DACH REGION</text>
    </g>

    <!-- Floating Metric Cards -->
    <g transform="translate(30, 260)">
      <rect width="180" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">PERFORMANCE</text>
      <text x="18" y="47" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="18">96+ PageSpeed</text>
    </g>

    <g transform="translate(240, 230)">
      <rect width="180" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">STREAMING</text>
      <text x="18" y="47" fill="#06B6D4" font-family="sans-serif" font-weight="800" font-size="18">&lt; 0.9s Page Load</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(80, 130)">
    <!-- Badge -->
    <g>
      <rect width="220" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4" fill="#A855F7" />
      <text x="28" y="21" fill="#C084FC" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0.5">ACADEMY CASE STUDY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#F8FAFC" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
      Telefontrainingskoffer
    </text>
    <text x="0" y="145" fill="#A855F7" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
      EdTech &amp; Media Streaming
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      Custom WordPress platform for German call-center training academy
    </text>
    <text x="0" y="222" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      with real-time audio playback, ACF architecture, and sub-second load.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 275)">
      <g>
        <text x="0" y="0" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="800">96+</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">PAGESPEED SCORE</text>
      </g>
      <g transform="translate(150, 0)">
        <text x="0" y="0" fill="#06B6D4" font-family="sans-serif" font-size="28" font-weight="800">&lt; 0.9s</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">LOAD TIME</text>
      </g>
      <g transform="translate(290, 0)">
        <text x="0" y="0" fill="#A855F7" font-family="sans-serif" font-size="28" font-weight="800">ACF + PHP</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">CUSTOM THEME</text>
      </g>
    </g>

    <!-- Author & Proof Row -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">Artur Yusupov</text>
      <text x="110" y="0" fill="#64748B" font-family="sans-serif" font-size="14">•</text>
      <text x="125" y="0" fill="#94A3B8" font-family="sans-serif" font-size="14">Applied in Production: Telefontrainingskoffer Germany</text>
    </g>
  </g>
</svg>

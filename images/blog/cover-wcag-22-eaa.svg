<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing gradients -->
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient light orbs -->
  <circle cx="350" cy="300" r="220" fill="#84cc16" opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="320" r="260" fill="#38bdf8" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="180" r="180" fill="#a855f7" opacity="0.06" filter="url(#glow)" />

  <!-- Central Isometric / Architectural Dashboard -->
  <g transform="translate(160, 90)">
    <!-- Main Slate Panel -->
    <rect x="60" y="40" width="760" height="380" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95" />
    <rect x="60" y="40" width="760" height="380" rx="24" fill="none" stroke="#84cc16" stroke-width="1" stroke-opacity="0.3" />

    <!-- Top window dots -->
    <circle cx="95" cy="70" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="115" cy="70" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="135" cy="70" r="5" fill="#10b981" opacity="0.8" />
    <line x1="160" y1="70" x2="320" y2="70" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Keyboard Navigation Focus Ring Demonstration (WCAG 2.2 Focus Appearance Criterion 2.4.13) -->
    <!-- Element 1: Focused button with 3px solid glowing double ring -->
    <rect x="100" y="110" width="180" height="50" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="96" y="106" width="188" height="58" rx="15" fill="none" stroke="#84cc16" stroke-width="2.5" filter="url(#glow)" />
    <!-- Visual icon inside focused button -->
    <circle cx="125" cy="135" r="8" fill="#84cc16" />
    <line x1="145" y1="135" x2="250" y2="135" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

    <!-- Key Navigation Trail (Tab Order indicator) -->
    <path d="M 284 135 C 340 135, 340 210, 396 210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow)" />
    <circle cx="396" cy="210" r="4" fill="#38bdf8" />

    <!-- Element 2: Secondary Target Size Compliance (WCAG 2.2 Target Size Minimum 24x24px 2.5.8) -->
    <rect x="400" y="180" width="200" height="60" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="430" y1="210" x2="560" y2="210" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Target size bounding box telemetry -->
    <rect x="394" y="174" width="212" height="72" rx="18" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Key Navigation Trail to Element 3 -->
    <path d="M 600 210 C 650 210, 650 300, 700 300" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="700" cy="300" r="4" fill="#a855f7" />

    <!-- Element 3: Contrast Ratio Verification Badge (WCAG Contrast Minimum 1.4.3 & Enhanced 1.4.6) -->
    <rect x="100" y="200" width="260" height="180" rx="18" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
    <!-- Contrast wave bar chart -->
    <rect x="130" y="320" width="22" height="40" rx="4" fill="#38bdf8" />
    <rect x="165" y="280" width="22" height="80" rx="4" fill="#6366f1" />
    <rect x="200" y="240" width="22" height="120" rx="4" fill="#a855f7" />
    <rect x="235" y="220" width="22" height="140" rx="4" fill="#84cc16" filter="url(#glow)" />
    <line x1="120" y1="365" x2="330" y2="365" stroke="#334155" stroke-width="1.5" />

    <!-- Right Side: Semantic Accessibility Tree & EAA 2026 Audit Grid -->
    <rect x="400" y="270" width="380" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
    <!-- DOM Nodes -->
    <circle cx="435" cy="305" r="7" fill="#84cc16" />
    <line x1="450" y1="305" x2="520" y2="305" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
    <circle cx="435" cy="345" r="7" fill="#38bdf8" />
    <line x1="450" y1="345" x2="560" y2="345" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Status Shield / Compliance Seal graphic -->
    <g transform="translate(680, 290)">
      <polygon points="40,10 70,22 70,55 40,75 10,55 10,22" fill="#0f172a" stroke="#84cc16" stroke-width="2" filter="url(#glow)" />
      <path d="M 28 42 L 36 50 L 52 34" fill="none" stroke="#84cc16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>

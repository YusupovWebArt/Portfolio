<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c1326"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="220" cy="180" r="140" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="960" cy="450" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="220" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>

  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="20" r="6" fill="#10b981"/>
    <text x="95" y="25" fill="#94a3b8" font-family="monospace" font-size="12">b2b-pricing-engine.ts</text>

    <g transform="translate(25, 60)" font-family="monospace" font-size="11.5">
      <text y="20" fill="#8b5cf6">export async function <tspan fill="#38bdf8">resolveTieredPrice</tspan>(ctx) {</text>
      <text y="42" fill="#94a3b8">  // Sub-2ms Redis Contract Matrix Lookup</text>
      <text y="64" fill="#94a3b8">  const contract = await redis.hgetall(`b2b:${ctx.orgId}`)</text>
      <text y="86" fill="#8b5cf6">  const unitPrice = computeVolumeDiscount(contract, ctx.qty)</text>
      <text y="108" fill="#10b981">  return { unitPrice, netTerms: 'Net-30', taxExempt: true }</text>
      <text y="130" fill="#8b5cf6">}</text>

      <rect y="150" width="400" height="215" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="15" y="180" fill="#10b981" font-weight="bold">✓ Headless B2B Architecture Metrics</text>
      <text x="15" y="204" fill="#cbd5e1">• Price Resolution Latency: <tspan fill="#10b981">2ms (Redis Edge)</tspan></text>
      <text x="15" y="226" fill="#cbd5e1">• Legacy Monolith (SAP): <tspan fill="#ef4444">2,850ms TTFB (-98.7%)</tspan></text>
      <text x="15" y="248" fill="#cbd5e1">• Annual TCO Savings: <tspan fill="#10b981">84% Lower Cost</tspan></text>
      <text x="15" y="270" fill="#cbd5e1">• ERP Sync Protocol: <tspan fill="#38bdf8">Asynchronous BullMQ</tspan></text>
      <text x="15" y="292" fill="#cbd5e1">• Order Storage: <tspan fill="#6366f1">WooCommerce HPOS</tspan></text>
      <text x="15" y="314" fill="#cbd5e1">• Wholesale Mobile Re-order: <tspan fill="#f59e0b">24s (was 4.2m)</tspan></text>
      <text x="15" y="336" fill="#cbd5e1">• Payment Workflows: <tspan fill="#38bdf8">Net-30 / ACH / PO#</tspan></text>
    </g>
  </g>

  <g transform="translate(90, 110)">
    <g transform="translate(0, 0)">
      <rect width="215" height="32" rx="16" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#6366f1"/>
      <text x="30" y="21" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">B2B E-COMMERCE</text>
    </g>

    <text x="0" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Enterprise B2B Headless</tspan>
      <tspan x="0" dy="50" fill="url(#primaryGlow)">E-Commerce Architecture</tspan>
      <tspan x="0" dy="50">Next.js 16 &amp; HPOS</tspan>
    </text>

    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Replacing $250k/yr SAP/Magento monoliths with sub-35ms</tspan>
      <tspan x="0" dy="24">edge pricing, customer catalogs, Net-30 invoicing workflows,</tspan>
      <tspan x="0" dy="24">and real-time ERP sync with 84% lower total cost of ownership.</tspan>
    </text>

    <g transform="translate(0, 345)">
      <g transform="translate(0, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRICE RESOLUTION</text>
        <text x="15" y="47" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">&lt; 2ms</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TCO SAVINGS</text>
        <text x="15" y="47" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">84%</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="175" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BACK-OFFICE</text>
        <text x="15" y="47" fill="#6366f1" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Woo HPOS</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020814" />
      <stop offset="50%" stop-color="#030c1b" />
      <stop offset="100%" stop-color="#051b1a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="limeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#medBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="220" r="230" fill="#06b6d4" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="920" cy="260" r="250" fill="#10b981" opacity="0.09" filter="url(#glowFilter)" />
  <circle cx="600" cy="200" r="190" fill="#84cc16" opacity="0.07" filter="url(#glowFilter)" />

  <!-- Central Architecture Console Frame -->
  <g transform="translate(160, 80)">
    <!-- Main Console Frame -->
    <rect x="40" y="30" width="800" height="410" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.96" />
    <rect x="40" y="30" width="800" height="410" rx="24" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" />

    <!-- Window Controls -->
    <circle cx="75" cy="62" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="95" cy="62" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="115" cy="62" r="5" fill="#10b981" opacity="0.8" />
    <line x1="140" y1="62" x2="380" y2="62" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left Box: USDA FoodData Central Proxy -->
    <g transform="translate(75, 105)">
      <rect width="205" height="280" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="15" y="15" width="175" height="32" rx="8" fill="#083344" />
      <text x="102" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">USDA FOODDATA PROXY</text>

      <g transform="translate(15, 60)">
        <rect width="175" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Server Credential Masking</text>
        <text x="12" y="42" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="600">ZERO KEY LEAK</text>
      </g>

      <g transform="translate(15, 122)">
        <rect width="175" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Edge In-Memory SWR</text>
        <text x="12" y="42" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">28ms P95</text>
        <text x="75" y="42" fill="#64748b" font-family="system-ui" font-size="10">(-96% time)</text>
      </g>

      <g transform="translate(15, 184)">
        <rect width="175" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Rate Limit Shield</text>
        <text x="12" y="42" fill="#a3e635" font-family="monospace" font-size="11">0.00% 429 Errors</text>
      </g>

      <rect x="15" y="248" width="175" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" />
      <text x="102" y="262" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">EDGE ROUTE HANDLER</text>
    </g>

    <!-- Center Box: Nutrient Normalization & Bread Units -->
    <g transform="translate(325, 105)">
      <rect width="215" height="280" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="15" y="15" width="185" height="32" rx="8" fill="#064e3b" />
      <text x="107" y="36" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">BREAD UNITS ENGINE</text>

      <g transform="translate(15, 60)">
        <rect width="185" height="58" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Bread Units Formula</text>
        <text x="12" y="44" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">BU = NetCarbs / 12</text>
      </g>

      <g transform="translate(15, 126)">
        <rect width="185" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">Clinical 10-Diet Engine</text>
        <text x="12" y="40" fill="#facc15" font-family="monospace" font-size="11">Keto / Diabetic / Renal</text>
      </g>

      <g transform="translate(15, 188)">
        <rect width="185" height="54" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="20" fill="#94a3b8" font-family="system-ui" font-size="10">TypeScript Normalization</text>
        <text x="12" y="40" fill="#38bdf8" font-family="monospace" font-size="11">NormalizedFoodItem</text>
      </g>

      <rect x="15" y="250" width="185" height="20" rx="4" fill="#10b981" fill-opacity="0.15" />
      <text x="107" y="264" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">CLINICAL SCORING READY</text>
    </g>

    <!-- Right Box: Supabase RLS & HIPAA Boundary -->
    <g transform="translate(580, 105)">
      <rect width="210" height="280" rx="16" fill="#1e293b" stroke="#84cc16" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="15" y="15" width="180" height="32" rx="8" fill="#1a2e05" />
      <text x="105" y="36" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HIPAA DATA BOUNDARY</text>

      <g transform="translate(15, 60)">
        <rect width="180" height="62" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Supabase PostgreSQL</text>
        <text x="12" y="48" fill="#a3e635" font-family="monospace" font-size="18" font-weight="700">ROW LEVEL SEC</text>
      </g>

      <g transform="translate(15, 130)">
        <rect width="180" height="62" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">Patient Data Isolation</text>
        <text x="12" y="48" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700">100% ISOLATED</text>
      </g>

      <g transform="translate(15, 200)">
        <rect width="180" height="65" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">CMS Physical Separation</text>
        <text x="12" y="48" fill="#facc15" font-family="monospace" font-size="16" font-weight="700">ZERO PHI IN WP</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges / Tech Stack Line -->
  <g transform="translate(190, 535)">
    <!-- Badge 1: HealthTech Architecture -->
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="85" y="20" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HEALTHTECH ARCHITECTURE</text>

    <!-- Badge 2: USDA FoodData API -->
    <rect x="185" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
    <text x="267" y="20" fill="#a5f3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">USDA FOODDATA API</text>

    <!-- Badge 3: Bread Units Engine -->
    <rect x="365" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#84cc16" stroke-width="1" />
    <text x="442" y="20" fill="#d9f99d" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BREAD UNITS ENGINE</text>

    <!-- Badge 4: Supabase RLS -->
    <rect x="535" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#ca8a04" stroke-width="1" />
    <text x="607" y="20" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SUPABASE RLS HIPAA</text>

    <!-- Author Pill -->
    <rect x="695" y="0" width="135" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="762" y="20" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">ARTUR YUSUPOV</text>
  </g>
</svg>

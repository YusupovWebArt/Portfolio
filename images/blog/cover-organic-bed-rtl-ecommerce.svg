<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d0c" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#091a18" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="organicEmeraldLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <linearGradient id="cyanLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#orgBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="240" fill="#10B981" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="940" cy="300" r="260" fill="#A3E635" opacity="0.06" filter="url(#glowFilter)" />

  <!-- Central Visual: RTL E-Commerce Shopping Cart & Bedding Layer -->
  <g transform="translate(640, 130)">
    <!-- Cart / Bed Isometric Outline -->
    <g transform="translate(40, 50)">
      <polygon points="180,30 320,90 320,200 180,260 40,200 40,90" fill="#0F172A" stroke="url(#organicEmeraldLime)" stroke-width="3" filter="url(#glowFilter)"/>
      <polygon points="180,50 300,105 300,190 180,240 60,190 60,105" fill="#061413" stroke="#1E293B" stroke-width="1.5"/>

      <!-- RTL Directional Arrow <== -->
      <path d="M 240 145 H 120 L 150 120 M 120 145 L 150 170" stroke="#A3E635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Leaf / Organic Symbol -->
      <path d="M 180 80 C 180 120 220 120 220 80 C 180 80 180 80 180 80 Z" fill="#10B981" opacity="0.8"/>
    </g>

    <!-- RTL Tag -->
    <g transform="translate(250, 30)">
      <rect width="140" height="30" rx="15" fill="#061C19" stroke="#10B981" stroke-opacity="0.4"/>
      <text x="70" y="19" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">RTL &amp; HEBREW</text>
    </g>

    <!-- Floating Metric Cards -->
    <g transform="translate(0, 240)">
      <rect width="170" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">PERFORMANCE</text>
      <text x="18" y="47" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="18">PageSpeed 90+</text>
    </g>

    <g transform="translate(220, 250)">
      <rect width="180" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">MEDIA PIPELINE</text>
      <text x="18" y="47" fill="#A3E635" font-family="sans-serif" font-weight="800" font-size="18">-72% WebP Size</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(80, 130)">
    <!-- Badge -->
    <g>
      <rect width="230" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4" fill="#10B981" />
      <text x="28" y="21" fill="#34D399" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0.5">E-COMMERCE CASE STUDY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#F8FAFC" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
      Organic Bed RTL Store
    </text>
    <text x="0" y="145" fill="#10B981" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
      WooCommerce &amp; WebP
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      Custom right-to-left WordPress theme engineering with bidirectional CSS,
    </text>
    <text x="0" y="222" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      WebP image optimization pipeline, and sub-second checkout conversion.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 275)">
      <g>
        <text x="0" y="0" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="800">90+</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">PAGESPEED SCORE</text>
      </g>
      <g transform="translate(150, 0)">
        <text x="0" y="0" fill="#A3E635" font-family="sans-serif" font-size="28" font-weight="800">100%</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">RTL SUPPORT</text>
      </g>
      <g transform="translate(270, 0)">
        <text x="0" y="0" fill="#06B6D4" font-family="sans-serif" font-size="28" font-weight="800">-72%</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">WEBP PAYLOAD</text>
      </g>
    </g>

    <!-- Author & Proof Row -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">Artur Yusupov</text>
      <text x="110" y="0" fill="#64748B" font-family="sans-serif" font-size="14">•</text>
      <text x="125" y="0" fill="#94A3B8" font-family="sans-serif" font-size="14">Applied in Production: Organic Bed Israel</text>
    </g>
  </g>
</svg>

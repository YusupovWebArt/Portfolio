<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07091a"/>
      <stop offset="50%" stop-color="#111132"/>
      <stop offset="100%" stop-color="#080a1c"/>
    </linearGradient>
    <linearGradient id="gpuGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#d946ef" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="170" r="150" fill="#d946ef" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="440" r="170" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="320" r="220" fill="#8b5cf6" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="320" height="34" rx="17" fill="#d946ef" fill-opacity="0.12" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e879f9" letter-spacing="1.5">CLIENT-SIDE ML &amp; WEBGPU 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Client-Side WebGPU</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#gpuGlow)" letter-spacing="-0.5">Predictive Personalization</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">On-Device Collaborative Filtering, Privacy-First Recommendations</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Zero Server Tracking in Next.js 16 App Router</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">INFERENCE SPEED</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e879f9">&lt; 14 ms</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">SERVER ML COST</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#10b981">$0 Compute</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">PRIVACY AUDIT</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22d3ee">Zero Tracking</text>
    </g>

    <!-- Visual Tensor Calculation Node -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="24" r="5" fill="#d946ef"/>
      <text x="44" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">WebGPU Shader: MatMul [1x64] dot [64x1024] -> Top 4 in 11.2ms</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">webgpu-recommendation-pipeline.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// WebGPU compute pass execution</text>
      <text y="42" fill="#38bdf8">const</text>
      <text x="45" y="42" fill="#f1f5f9">adapter =</text>
      <text x="110" y="42" fill="#38bdf8">await</text>
      <text x="155" y="42" fill="#f1f5f9">navigator.gpu.requestAdapter();</text>

      <text y="66" fill="#38bdf8">const</text>
      <text x="45" y="66" fill="#f1f5f9">device =</text>
      <text x="100" y="66" fill="#38bdf8">await</text>
      <text x="145" y="66" fill="#f1f5f9">adapter.requestDevice();</text>

      <text y="92" fill="#64748b">// Run ONNX quantized INT8 model on WebGPU</text>
      <text y="114" fill="#38bdf8">const</text>
      <text x="45" y="114" fill="#f1f5f9">session =</text>
      <text x="110" y="114" fill="#38bdf8">await</text>
      <text x="155" y="114" fill="#f1f5f9">InferenceSession.create(</text>

      <text y="136" fill="#34d399">  '/models/collaborative_filter.onnx'</text>
      <text x="320" y="136" fill="#f1f5f9">,</text>

      <text y="158" fill="#f1f5f9">  { executionProviders: [</text>
      <text x="165" y="158" fill="#e879f9">'webgpu'</text>
      <text x="220" y="158" fill="#f1f5f9">] }</text>

      <text y="180" fill="#f1f5f9">);</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Benchmarked Efficiency</text>
      <text x="14" y="292" fill="#e879f9">GPU Inference Time:</text>
      <text x="210" y="292" fill="#f1f5f9">11.8 ms (Local Hardware)</text>

      <text x="14" y="314" fill="#22d3ee">User Click Privacy:</text>
      <text x="210" y="314" fill="#f1f5f9">100% In-Browser IndexedDB</text>

      <text x="14" y="336" fill="#10b981">Cloud Server Bill:</text>
      <text x="210" y="336" fill="#f1f5f9">$0.00 (Zero API Calls)</text>
    </g>
  </g>
</svg>

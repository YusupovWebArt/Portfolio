<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="50%" stop-color="#0b132d"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="dbGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="170" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="440" r="170" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="320" r="220" fill="#818cf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="330" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">EDGE DATABASE ARCHITECTURE 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Global Sub-20ms</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#dbGlow)" letter-spacing="-0.5">Database Read Latency</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Cloudflare Hyperdrive Connection Multiplexing, Turso</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Embedded Replicas &amp; On-Demand Tag Invalidation in Next.js 16</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">GLOBAL READ TTFB</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">&lt; 18 ms</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">TCP POOL ACCELERATION</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#10b981">16x Faster</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">EMBEDDED REPLICA</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#818cf8">In-Memory</text>
    </g>

    <!-- Visual Edge Routing Node -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="24" r="5" fill="#38bdf8"/>
      <text x="44" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">Hyperdrive: US-East -> Tokyo (Cache Hit: 14ms | No TLS Handshake)</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">hyperdrive-edge-client.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Pre-warmed Hyperdrive connection pool</text>
      <text y="42" fill="#38bdf8">const</text>
      <text x="45" y="42" fill="#f1f5f9">pool =</text>
      <text x="90" y="42" fill="#38bdf8">new</text>
      <text x="120" y="42" fill="#f1f5f9">Pool({</text>

      <text y="66" fill="#f1f5f9">  connectionString:</text>
      <text x="125" y="66" fill="#34d399">env.HYPERDRIVE.connectionString</text>
      <text x="360" y="66" fill="#f1f5f9">,</text>

      <text y="90" fill="#f1f5f9">  maxConnections:</text>
      <text x="120" y="90" fill="#38bdf8">20</text>
      <text x="140" y="90" fill="#f1f5f9">,</text>

      <text y="112" fill="#f1f5f9">});</text>

      <text y="138" fill="#64748b">// Turso embedded local replica sync</text>
      <text y="160" fill="#38bdf8">const</text>
      <text x="45" y="160" fill="#f1f5f9">client = createClient({</text>

      <text y="184" fill="#f1f5f9">  url:</text>
      <text x="45" y="184" fill="#34d399">'file:local-replica.db'</text>
      <text x="210" y="184" fill="#f1f5f9">,</text>

      <text y="206" fill="#f1f5f9">  syncUrl:</text>
      <text x="75" y="206" fill="#34d399">'libsql://primary-db.turso.io'</text>

      <text y="228" fill="#f1f5f9">});</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Global Latency Comparison</text>
      <text x="14" y="292" fill="#ef4444">Direct Centralized MySQL:</text>
      <text x="210" y="292" fill="#f1f5f9">280 ms (Cross-Ocean)</text>

      <text x="14" y="314" fill="#38bdf8">Hyperdrive Edge Pool:</text>
      <text x="210" y="314" fill="#f1f5f9">14 ms (TCP Pre-warmed)</text>

      <text x="14" y="336" fill="#10b981">Turso Local Embedded:</text>
      <text x="210" y="336" fill="#f1f5f9">1.8 ms (Local SQLite)</text>
    </g>
  </g>
</svg>

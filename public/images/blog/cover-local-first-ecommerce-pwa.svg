<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c1426"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="240" cy="180" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="960" cy="450" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="220" fill="#8b5cf6" opacity="0.05" filter="url(#glow)"/>

  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="20" r="6" fill="#10b981"/>
    <text x="95" y="25" fill="#94a3b8" font-family="monospace" font-size="12">crdt-cart-store.ts</text>

    <g transform="translate(25, 60)" font-family="monospace" font-size="11.5">
      <text y="20" fill="#8b5cf6">const <tspan fill="#38bdf8">doc</tspan> = new <tspan fill="#06b6d4">Y.Doc</tspan>()</text>
      <text y="42" fill="#8b5cf6">const <tspan fill="#38bdf8">cartMap</tspan> = doc.getMap(<tspan fill="#10b981">'cartItems'</tspan>)</text>
      <text y="64" fill="#94a3b8">// IndexedDB Local-First Persistence Provider</text>
      <text y="86" fill="#8b5cf6">new <tspan fill="#eab308">IndexeddbPersistence</tspan>(<tspan fill="#10b981">'ecommerce-cart'</tspan>, doc)</text>
      <text y="108" fill="#94a3b8">// Deterministic State Vector Merge</text>
      <text y="130" fill="#8b5cf6">Y.<tspan fill="#38bdf8">applyUpdate</tspan>(doc, serverDeltaVector)</text>

      <rect y="160" width="400" height="200" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="15" y="190" fill="#10b981" font-weight="bold">✓ Local-First CRDT Telemetry</text>
      <text x="15" y="214" fill="#cbd5e1">• Mutation Latency: <tspan fill="#10b981">4ms (Local Zero-Wait)</tspan></text>
      <text x="15" y="236" fill="#cbd5e1">• Legacy Server Latency: <tspan fill="#ef4444">680ms (-99.4%)</tspan></text>
      <text x="15" y="258" fill="#cbd5e1">• Offline Functionality: <tspan fill="#38bdf8">100% Full Interactivity</tspan></text>
      <text x="15" y="280" fill="#cbd5e1">• Multi-Tab State Conflict: <tspan fill="#10b981">0 Data Loss (CRDT)</tspan></text>
      <text x="15" y="302" fill="#cbd5e1">• Mobile Checkout Lift: <tspan fill="#f59e0b">+23.6% Conversion</tspan></text>
      <text x="15" y="324" fill="#cbd5e1">• Storage Quota: <tspan fill="#38bdf8">Persistent IndexedDB</tspan></text>
      <text x="15" y="346" fill="#cbd5e1">• Sync Protocol: <tspan fill="#8b5cf6">Binary State Vectors</tspan></text>
    </g>
  </g>

  <g transform="translate(90, 110)">
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#06b6d4"/>
      <text x="30" y="21" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">LOCAL-FIRST E-COMMERCE</text>
    </g>

    <text x="0" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Local-First E-Commerce PWA:</tspan>
      <tspan x="0" dy="50" fill="url(#primaryGlow)">Offline Cart Sync</tspan>
      <tspan x="0" dy="50">&amp; CRDTs with Yjs</tspan>
    </text>

    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Eliminating mobile cart abandonment: sub-10ms UI mutations,</tspan>
      <tspan x="0" dy="24">conflict-free multi-tab merges with Yjs state vectors, and</tspan>
      <tspan x="0" dy="24">IndexedDB persistence with background server synchronization.</tspan>
    </text>

    <g transform="translate(0, 345)">
      <g transform="translate(0, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CART LATENCY</text>
        <text x="15" y="47" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">4ms</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OFFLINE RESILIENCE</text>
        <text x="15" y="47" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">100%</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="175" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CVR UPLIFT</text>
        <text x="15" y="47" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="800">+23.6% Mobile</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
<!-- Background Gradient -->
<linearGradient id="aiSearchBg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#030712" />
<stop offset="50%" stop-color="#090f24" />
<stop offset="100%" stop-color="#110e2e" />
</linearGradient>
<!-- Accent Gradients -->
<linearGradient id="neuralPurple" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.95" />
<stop offset="100%" stop-color="#d946ef" stop-opacity="0.9" />
</linearGradient>
<linearGradient id="vectorCyan" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
<stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
</linearGradient>
<linearGradient id="emeraldMatch" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.95" />
<stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
</linearGradient>
<filter id="glowAi" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="8" result="blur" />
<feMerge>
<feMergeNode in="blur" />
<feMergeNode in="SourceGraphic" />
</feMerge>
</filter>
<pattern id="gridAi" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45"/>
</pattern>
</defs>
<!-- Background Layer -->
<rect width="1200" height="630" fill="url(#aiSearchBg)" />
<rect width="1200" height="630" fill="url(#gridAi)" />
<!-- Ambient Light Orbs -->
<circle cx="280" cy="220" r="230" fill="#8b5cf6" opacity="0.08" filter="url(#glowAi)" />
<circle cx="920" cy="260" r="250" fill="#00f0ff" opacity="0.09" filter="url(#glowAi)" />
<circle cx="600" cy="180" r="190" fill="#10b981" opacity="0.07" filter="url(#glowAi)" />
<!-- Central Search Console Frame -->
<g transform="translate(160, 80)">
<!-- Main Console Frame -->
<rect x="40" y="30" width="800" height="410" rx="24" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" opacity="0.96" />
<rect x="40" y="30" width="800" height="410" rx="24" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.35" />
<!-- Window Controls -->
<circle cx="75" cy="62" r="5" fill="#f43f5e" opacity="0.8" />
<circle cx="95" cy="62" r="5" fill="#eab308" opacity="0.8" />
<circle cx="115" cy="62" r="5" fill="#10b981" opacity="0.8" />
<line x1="140" y1="62" x2="380" y2="62" stroke="#334155" stroke-width="2" stroke-linecap="round" />
<!-- Header Badge -->
<rect x="500" y="50" width="320" height="24" rx="6" fill="#1e293b" />
<text x="660" y="66" fill="#00f0ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">IN-BROWSER WEBASSEMBLY VECTOR SEARCH</text>
<!-- Left Box: Sparse Lexical Match (Okapi BM25) -->
<g transform="translate(70, 95)">
<rect width="210" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
<rect x="15" y="15" width="180" height="28" rx="6" fill="#1e293b" />
<text x="105" y="33" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SPARSE LEXICAL (BM25)</text>
<text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Exact SKU Lookup</text>
<text x="190" y="70" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">100% MATCH</text>
<text x="20" y="98" fill="#94a3b8" font-family="monospace" font-size="11">Typo Tolerance</text>
<text x="190" y="98" fill="#00f0ff" font-family="monospace" font-size="11" text-anchor="end">Levenshtein</text>
<text x="20" y="126" fill="#94a3b8" font-family="monospace" font-size="11">Inverted Index</text>
<text x="190" y="126" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">In-Memory</text>
<text x="20" y="154" fill="#94a3b8" font-family="monospace" font-size="11">Execution Time</text>
<text x="190" y="154" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">&lt; 3ms</text>
<path d="M 20 178 L 190 178" stroke="#1e293b" stroke-width="1" />
<circle cx="28" cy="202" r="4" fill="#38bdf8" />
<text x="40" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Sparse Keyword Weighting</text>
</g>
<!-- Flow Arrow 1 -->
<path d="M 285 210 L 325 210" stroke="url(#vectorCyan)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
<polygon points="328,210 320,205 320,215" fill="#00f0ff" />
<!-- Center Box: Hybrid Fusion Engine (RRF) -->
<g transform="translate(335, 85)">
<rect width="210" height="250" rx="16" fill="#091428" stroke="#8b5cf6" stroke-width="1.8" />
<!-- Neural Network Node Icon Header -->
<circle cx="105" cy="45" r="16" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
<circle cx="80" cy="65" r="8" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
<circle cx="130" cy="65" r="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
<line x1="95" y1="52" x2="85" y2="60" stroke="#8b5cf6" stroke-width="1.5" />
<line x1="115" y1="52" x2="125" y2="60" stroke="#8b5cf6" stroke-width="1.5" />
<text x="105" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Hybrid RRF Engine</text>
<text x="105" y="125" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Reciprocal Rank Fusion</text>
<rect x="20" y="145" width="170" height="26" rx="6" fill="#1e293b" />
<text x="105" y="162" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Score = Σ 1 / (60 + Rank)</text>
<rect x="20" y="178" width="170" height="26" rx="6" fill="#1e293b" />
<text x="105" y="195" fill="#10b981" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Query Latency: &lt; 18ms</text>
<rect x="20" y="210" width="170" height="26" rx="6" fill="#1e293b" />
<text x="105" y="227" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Vector DB Cost: $0/mo</text>
</g>
<!-- Flow Arrow 2 -->
<path d="M 550 210 L 590 210" stroke="url(#emeraldMatch)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" />
<polygon points="593,210 585,205 585,215" fill="#10b981" />
<!-- Right Box: Dense Vector Embedding (WASM ONNX) -->
<g transform="translate(600, 95)">
<rect width="210" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
<rect x="15" y="15" width="180" height="28" rx="6" fill="#1e293b" />
<text x="105" y="33" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DENSE VECTOR (WASM)</text>
<text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="11">Model Architecture</text>
<text x="190" y="70" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="end">MiniLM-L6</text>
<text x="20" y="98" fill="#94a3b8" font-family="monospace" font-size="11">Quantization</text>
<text x="190" y="98" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">INT8 (23MB)</text>
<text x="20" y="126" fill="#94a3b8" font-family="monospace" font-size="11">Cache Layer</text>
<text x="190" y="126" fill="#00f0ff" font-family="monospace" font-size="11" text-anchor="end">IndexedDB</text>
<text x="20" y="154" fill="#94a3b8" font-family="monospace" font-size="11">Dimensions</text>
<text x="190" y="154" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">384 Dense</text>
<path d="M 20 178 L 190 178" stroke="#1e293b" stroke-width="1" />
<circle cx="28" cy="202" r="4" fill="#a855f7" />
<text x="40" y="206" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Conceptual Semantic Match</text>
</g>
<!-- Bottom Telemetry Badges -->
<g transform="translate(60, 360)">
<rect width="160" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="80" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SEARCH SPEED</text>
<text x="80" y="42" fill="#00f0ff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">&lt; 18ms LATENCY</text>
</g>
<g transform="translate(245, 360)">
<rect width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="90" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CLOUD VECTOR COST</text>
<text x="90" y="42" fill="#10b981" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">$0 / MONTH</text>
</g>
<g transform="translate(450, 360)">
<rect width="170" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="85" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">OFFLINE CAPABILITY</text>
<text x="85" y="42" fill="#a855f7" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">100% PRIVATE</text>
</g>
<g transform="translate(645, 360)">
<rect width="165" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
<text x="82" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SEARCH-AS-YOU-TYPE</text>
<text x="82" y="42" fill="#10b981" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">60 FPS SMOOTH</text>
</g>
</g>
</svg>
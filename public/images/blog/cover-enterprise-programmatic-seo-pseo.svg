<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0d1629"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="220" cy="180" r="140" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="960" cy="450" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="220" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>

  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="6" fill="#ef4444"/>
    <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="20" r="6" fill="#10b981"/>
    <text x="95" y="25" fill="#94a3b8" font-family="monospace" font-size="12">pseo-pipeline-engine.ts</text>

    <g transform="translate(25, 60)" font-family="monospace" font-size="11.5">
      <text y="20" fill="#10b981">export async function <tspan fill="#38bdf8">generateStaticParams</tspan>() {</text>
      <text y="42" fill="#94a3b8">  // 10,000+ Deterministic Data Nodes</text>
      <text y="64" fill="#94a3b8">  const slugs = await db.select().from(catalog)</text>
      <text y="86" fill="#8b5cf6">  return <tspan fill="#38bdf8">slugs.map</tspan>(p =&gt; ({ industry: p.ind, solution: p.sol }))</text>
      <text y="108" fill="#10b981">}</text>

      <rect y="130" width="400" height="235" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="15" y="160" fill="#10b981" font-weight="bold">✓ Enterprise pSEO Metrics</text>
      <text x="15" y="184" fill="#cbd5e1">• Programmatic Route Scale: <tspan fill="#38bdf8">10,000+ SSG/ISR</tspan></text>
      <text x="15" y="206" fill="#cbd5e1">• Google Indexation Rate: <tspan fill="#10b981">98.2% Valid Index</tspan></text>
      <text x="15" y="228" fill="#cbd5e1">• Template pSEO Index Rate: <tspan fill="#ef4444">18.4% (Thin Content)</tspan></text>
      <text x="15" y="250" fill="#cbd5e1">• Google HCU Status: <tspan fill="#10b981">100% Quality Immunity</tspan></text>
      <text x="15" y="272" fill="#cbd5e1">• Schema.org Linked Graph: <tspan fill="#f59e0b">Valid JSON-LD</tspan></text>
      <text x="15" y="294" fill="#cbd5e1">• Edge Delivery Latency: <tspan fill="#38bdf8">&lt; 35ms TTFB</tspan></text>
      <text x="15" y="316" fill="#cbd5e1">• Monthly Organic Reach: <tspan fill="#10b981">140k+ Impressions</tspan></text>
      <text x="15" y="338" fill="#cbd5e1">• Unique Data Enriched: <tspan fill="#f59e0b">Zod Verified Math</tspan></text>
    </g>
  </g>

  <g transform="translate(90, 110)">
    <g transform="translate(0, 0)">
      <rect width="230" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="30" y="21" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">GROWTH ENGINEERING</text>
    </g>

    <text x="0" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">Enterprise Programmatic</tspan>
      <tspan x="0" dy="50" fill="url(#primaryGlow)">SEO (pSEO) at Scale</tspan>
      <tspan x="0" dy="50">with Next.js 16 &amp; LLMs</tspan>
    </text>

    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Generating 10,000+ high-intent landing pages without thin-content</tspan>
      <tspan x="0" dy="24">penalties: autonomous LLM data enrichment, strict Zod schemas,</tspan>
      <tspan x="0" dy="24">and structured Schema.org graphs indexing 98.2% on Google.</tspan>
    </text>

    <g transform="translate(0, 345)">
      <g transform="translate(0, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PAGE SCALE</text>
        <text x="15" y="47" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">10,000+</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">INDEX RATE</text>
        <text x="15" y="47" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">98.2%</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="175" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GOOGLE STATUS</text>
        <text x="15" y="47" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Zero Penalties</text>
      </g>
    </g>
  </g>
</svg>

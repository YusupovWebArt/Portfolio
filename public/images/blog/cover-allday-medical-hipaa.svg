<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c14" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#071520" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="medCyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#medBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Glow -->
  <circle cx="280" cy="220" r="240" fill="#06B6D4" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="940" cy="300" r="260" fill="#10B981" opacity="0.07" filter="url(#glowFilter)" />

  <!-- Central Visual: Medical Cross & Secure PHI Shield -->
  <g transform="translate(640, 130)">
    <!-- Shield Container -->
    <polygon points="200,30 310,70 310,210 200,280 90,210 90,70" fill="#0F172A" stroke="url(#medCyanEmerald)" stroke-width="3.5" filter="url(#glowFilter)"/>
    <polygon points="200,50 290,85 290,195 200,255 110,195 110,85" fill="#07121C" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Medical Plus Cross in Vibrant Emerald -->
    <path d="M 185 110 H 215 V 140 H 245 V 170 H 215 V 200 H 185 V 170 H 155 V 140 H 185 Z" fill="#10B981"/>

    <!-- US Market Badge -->
    <g transform="translate(130, 20)">
      <rect width="140" height="30" rx="15" fill="#0A1826" stroke="#06B6D4" stroke-opacity="0.4"/>
      <text x="70" y="19" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">HIPAA SECURE</text>
    </g>

    <!-- Floating Metric Cards -->
    <g transform="translate(10, 240)">
      <rect width="170" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">PHI PROTECTION</text>
      <text x="18" y="47" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="18">Zero-Leakage</text>
    </g>

    <g transform="translate(230, 260)">
      <rect width="180" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="26" fill="#94A3B8" font-family="monospace" font-size="11">MOBILE CLINIC</text>
      <text x="18" y="47" fill="#06B6D4" font-family="sans-serif" font-weight="800" font-size="18">0.7s LCP</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(80, 130)">
    <!-- Badge -->
    <g>
      <rect width="210" height="32" rx="16" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3"/>
      <circle cx="16" cy="16" r="4" fill="#06B6D4" />
      <text x="28" y="21" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0.5">HEALTHTECH CASE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#F8FAFC" font-family="sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
      All Day Medical Care
    </text>
    <text x="0" y="145" fill="#10B981" font-family="sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">
      HIPAA Architecture &amp; PHI
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      Enterprise medical clinic web architecture with end-to-end encryption,
    </text>
    <text x="0" y="222" fill="#94A3B8" font-family="sans-serif" font-size="18" font-weight="400">
      zero third-party tracking, and sub-second urgent care appointment booking.
    </text>

    <!-- Metrics Row -->
    <g transform="translate(0, 275)">
      <g>
        <text x="0" y="0" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="800">100%</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">HIPAA COMPLIANT</text>
      </g>
      <g transform="translate(160, 0)">
        <text x="0" y="0" fill="#06B6D4" font-family="sans-serif" font-size="28" font-weight="800">&lt; 0.8s</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">MOBILE SPEED</text>
      </g>
      <g transform="translate(290, 0)">
        <text x="0" y="0" fill="#3B82F6" font-family="sans-serif" font-size="28" font-weight="800">TLS 1.3</text>
        <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="11">ENCRYPTED FORMS</text>
      </g>
    </g>

    <!-- Author & Proof Row -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">Artur Yusupov</text>
      <text x="110" y="0" fill="#64748B" font-family="sans-serif" font-size="14">•</text>
      <text x="125" y="0" fill="#94A3B8" font-family="sans-serif" font-size="14">Applied in Production: All Day Medical Care USA</text>
    </g>
  </g>
</svg>

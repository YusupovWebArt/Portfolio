<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#060918"/>
    </linearGradient>
    <linearGradient id="zoneGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#06b6d4"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#6366f1" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="170" r="150" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="440" r="170" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="320" r="220" fill="#d946ef" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="335" height="34" rx="17" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="1.5">ENTERPRISE SCALE &amp; EDGE 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Multi-Zone Micro-Frontends</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#zoneGlow)" letter-spacing="-0.5">at the Cloudflare Edge</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Autonomous Next.js 16 Deployments, Zero Downtime</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Unified Single-Domain View Transitions</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">EDGE DISPATCH</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22d3ee">&lt; 4 ms</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">DEPLOY INDEPENDENCE</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#818cf8">100% Isolated</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">CANARY ROLLOUT</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">Zero Downtime</text>
    </g>

    <!-- Zone Distribution Bar -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#38bdf8">/shop (Commerce)</text>
      <text x="175" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#818cf8">/lab (WASM)</text>
      <text x="300" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">/blog (ISR)</text>
      <text x="415" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#f43f5e">/account</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">edge-multi-zone-router.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Cloudflare Worker Edge Zone Dispatch</text>
      <text y="42" fill="#38bdf8">export default</text>
      <text x="105" y="42" fill="#f1f5f9">{</text>
      <text y="64" fill="#38bdf8">  async</text>
      <text x="45" y="64" fill="#f1f5f9">fetch(req: Request, env: Env) {</text>

      <text y="88" fill="#38bdf8">    const</text>
      <text x="45" y="88" fill="#f1f5f9">{ pathname } =</text>
      <text x="135" y="88" fill="#38bdf8">new</text>
      <text x="165" y="88" fill="#f1f5f9">URL(req.url);</text>

      <text y="112" fill="#38bdf8">    if</text>
      <text x="25" y="112" fill="#f1f5f9">(pathname.startsWith(</text>
      <text x="175" y="112" fill="#34d399">'/lab'</text>
      <text x="215" y="112" fill="#f1f5f9">)) {</text>

      <text y="134" fill="#38bdf8">      return</text>
      <text x="50" y="134" fill="#f1f5f9">fetch(env.LAB_ORIGIN + pathname, req);</text>

      <text y="156" fill="#f1f5f9">    }</text>

      <text y="178" fill="#38bdf8">    if</text>
      <text x="25" y="178" fill="#f1f5f9">(pathname.startsWith(</text>
      <text x="175" y="178" fill="#34d399">'/shop'</text>
      <text x="225" y="178" fill="#f1f5f9">)) {</text>

      <text y="200" fill="#38bdf8">      return</text>
      <text x="50" y="200" fill="#f1f5f9">fetch(env.SHOP_ORIGIN + pathname, req);</text>

      <text y="222" fill="#f1f5f9">    }</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Runtime Isolation Verification</text>
      <text x="14" y="292" fill="#22d3ee">Shop Storefront LCP:</text>
      <text x="200" y="292" fill="#f1f5f9">0.68 s (Zero WASM Bloat)</text>

      <text x="14" y="314" fill="#818cf8">Lab Compiler Bundle:</text>
      <text x="200" y="314" fill="#f1f5f9">Isolated in /lab Zone</text>

      <text x="14" y="336" fill="#10b981">CI/CD Deploy Lock:</text>
      <text x="200" y="336" fill="#f1f5f9">0 Downtime Canary Active</text>
    </g>
  </g>
</svg>

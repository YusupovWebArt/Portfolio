<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="migBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0e0a1f" />
    </linearGradient>

    <!-- Glowing gradients -->
    <linearGradient id="cloudVioletGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cloudSkyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cloudEmeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glowMig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridMig" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#migBg)" />
  <rect width="1200" height="630" fill="url(#gridMig)" />

  <!-- Ambient light orbs -->
  <circle cx="340" cy="270" r="230" fill="#8b5cf6" opacity="0.08" filter="url(#glowMig)" />
  <circle cx="860" cy="310" r="250" fill="#38bdf8" opacity="0.08" filter="url(#glowMig)" />
  <circle cx="600" cy="170" r="190" fill="#10b981" opacity="0.06" filter="url(#glowMig)" />

  <!-- Central Cloud Operations Console Frame -->
  <g transform="translate(160, 85)">
    <!-- Main Console Frame -->
    <rect x="60" y="40" width="760" height="390" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
    <rect x="60" y="40" width="760" height="390" rx="24" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

    <!-- Window Controls -->
    <circle cx="95" cy="72" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="115" cy="72" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="135" cy="72" r="5" fill="#10b981" opacity="0.8" />
    <line x1="160" y1="72" x2="330" y2="72" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left: Legacy On-Premise / Old Server Cluster -->
    <g transform="translate(100, 110)">
      <rect x="0" y="0" width="230" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <line x1="25" y1="28" x2="130" y2="28" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
      <rect x="150" y="18" width="55" height="20" rx="6" fill="#f43f5e" fill-opacity="0.15" />
      <line x1="162" y1="28" x2="192" y2="28" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />

      <!-- Server Racks -->
      <g transform="translate(25, 55)">
        <rect x="0" y="0" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="15" r="4" fill="#eab308" />
        <line x1="35" y1="15" x2="150" y2="15" stroke="#475569" stroke-width="2" stroke-linecap="round" />

        <rect x="0" y="40" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="55" r="4" fill="#eab308" />
        <line x1="35" y1="55" x2="150" y2="55" stroke="#475569" stroke-width="2" stroke-linecap="round" />

        <rect x="0" y="80" width="180" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="95" r="4" fill="#10b981" />
        <line x1="35" y1="95" x2="150" y2="95" stroke="#475569" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Center: High-Speed Streaming Migration Pipeline & 301 Load Balancer -->
    <g transform="translate(345, 130)">
      <path d="M 0 70 C 50 20, 80 20, 130 70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" filter="url(#glowMig)" />
      <path d="M 0 70 C 50 120, 80 120, 130 70" fill="none" stroke="#8b5cf6" stroke-width="3" filter="url(#glowMig)" />

      <!-- Transit packet nodes -->
      <circle cx="65" cy="45" r="7" fill="#38bdf8" filter="url(#glowMig)" />
      <circle cx="65" cy="95" r="7" fill="#8b5cf6" filter="url(#glowMig)" />

      <circle cx="65" cy="70" r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <path d="M 58 70 L 63 75 L 73 65" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right: Modern AWS Cloud Architecture Cluster -->
    <g transform="translate(490, 110)">
      <rect x="0" y="0" width="290" height="180" rx="16" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
      <rect x="0" y="0" width="290" height="180" rx="16" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

      <circle cx="30" cy="28" r="8" fill="#10b981" filter="url(#glowMig)" />
      <line x1="48" y1="28" x2="170" y2="28" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <rect x="210" y="18" width="60" height="20" rx="6" fill="#10b981" fill-opacity="0.15" />
      <line x1="222" y1="28" x2="258" y2="28" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

      <!-- Cloud Infrastructure Nodes -->
      <g transform="translate(25, 60)">
        <rect x="0" y="0" width="70" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="15" y1="21" x2="55" y2="21" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

        <line x1="70" y1="21" x2="90" y2="21" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
        <rect x="90" y="0" width="70" height="42" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
        <line x1="105" y1="21" x2="145" y2="21" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />

        <line x1="160" y1="21" x2="180" y2="21" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
        <rect x="180" y="0" width="60" height="42" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowMig)" />
        <circle cx="210" cy="21" r="10" fill="#10b981" fill-opacity="0.2" />
        <circle cx="210" cy="21" r="5" fill="#34d399" />
      </g>

      <line x1="25" y1="135" x2="265" y2="135" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <line x1="25" y1="135" x2="245" y2="135" stroke="url(#cloudEmeraldGlow)" stroke-width="4" stroke-linecap="round" filter="url(#glowMig)" />
      <line x1="25" y1="155" x2="160" y2="155" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Bottom: Zero-Downtime Verification & DNS Propagation -->
    <g transform="translate(100, 310)">
      <rect x="0" y="0" width="680" height="100" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
      
      <!-- Metric 1: Uptime -->
      <g transform="translate(40, 25)">
        <line x1="0" y1="5" x2="90" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="120" y2="25" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="70" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Metric 2: SEO Traffic Preserved -->
      <g transform="translate(260, 25)">
        <line x1="0" y1="5" x2="110" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="140" y2="25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="90" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Metric 3: DB Query Latency -->
      <g transform="translate(480, 25)">
        <line x1="0" y1="5" x2="100" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="25" x2="130" y2="25" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="45" x2="80" y2="45" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cfOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <circle cx="240" cy="180" r="240" fill="#f97316" opacity="0.11" filter="url(#glow)" />
  <circle cx="960" cy="420" r="260" fill="#7c3aed" opacity="0.12" filter="url(#glow)" />
  <circle cx="620" cy="520" r="200" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Left Main Architecture Card -->
  <g transform="translate(70, 72)">
    <rect width="635" height="486" rx="20" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Top Window Bar -->
    <rect width="635" height="52" rx="20" fill="#0f172a" fill-opacity="0.92" />
    <path d="M 0 52 L 635 52" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="26" r="6" fill="#ef4444" />
    <circle cx="52" cy="26" r="6" fill="#f59e0b" />
    <circle cx="72" cy="26" r="6" fill="#10b981" />
    <text x="98" y="31" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CLOUDFLARE WORKERS + STATIC ASSETS + DUAL CI/CD</text>

    <!-- Badge -->
    <g transform="translate(34, 74)">
      <rect width="295" height="30" rx="8" fill="#431407" fill-opacity="0.75" stroke="#f97316" stroke-width="1" />
      <text x="14" y="20" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">NEXT.JS 16 EDGE MIGRATION ($0/MO)</text>
    </g>

    <!-- Title -->
    <text x="34" y="142" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="29" font-weight="800">Vercel to Cloudflare Workers</text>
    <text x="34" y="176" fill="#fb923c" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Unlimited Static Assets, 1.22ms RAG &amp; DevSecOps</text>

    <!-- Pipeline Diagram -->
    <g transform="translate(34, 206)">
      <rect width="567" height="132" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />

      <!-- Node 1 -->
      <g transform="translate(16, 22)">
        <rect width="160" height="88" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="12" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1. BUILD TIME</text>
        <text x="12" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">BM25 + SSG Export</text>
        <text x="12" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">520 pages / 17k tokens</text>
        <text x="12" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">5,751 static assets</text>
      </g>

      <path d="M 182 66 L 200 66" stroke="#f97316" stroke-width="2" />

      <!-- Node 2 -->
      <g transform="translate(204, 22)">
        <rect width="164" height="88" rx="10" fill="#052e16" fill-opacity="0.55" stroke="#10b981" stroke-width="1.5" />
        <text x="12" y="24" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">2. STATIC ASSETS (99.5%)</text>
        <text x="12" y="46" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Edge CDN + _headers</text>
        <text x="12" y="65" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Unlimited bandwidth</text>
        <text x="12" y="80" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10">0 Worker invocations</text>
      </g>

      <path d="M 374 66 L 392 66" stroke="#a78bfa" stroke-width="2" />

      <!-- Node 3 -->
      <g transform="translate(396, 22)">
        <rect width="155" height="88" rx="10" fill="#2e1065" fill-opacity="0.65" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="12" y="24" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700">3. WORKER (/api/*)</text>
        <text x="12" y="46" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hybrid RAG Edge</text>
        <text x="12" y="65" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">1.22ms median CPU</text>
        <text x="12" y="80" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="10">HMAC rate limiting</text>
      </g>
    </g>

    <!-- Bottom Guardrails Strip -->
    <g transform="translate(34, 360)">
      <rect width="567" height="94" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="18" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">PRODUCTION SECURITY, SEO &amp; GEO PARITY</text>
      <text x="18" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">7 HTTP Security Headers  |  Always Use HTTPS  |  Bot Fight Mode</text>
      <text x="18" y="77" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">512 GSC URLs  |  513 IndexNow HTTP 200  |  llms.txt + RSS 2.0</text>
    </g>
  </g>

  <!-- Right Metrics Column -->
  <g transform="translate(735, 72)">
    <!-- Metric Card 1 -->
    <rect width="395" height="148" rx="18" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="26" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">WORKER CPU OPTIMIZATION</text>
    <text x="26" y="86" fill="#34d399" font-family="system-ui, sans-serif" font-size="42" font-weight="800">1.22 ms</text>
    <text x="26" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Down from 206 ms cold start (~168x faster)</text>
    <rect x="26" y="126" width="343" height="6" rx="3" fill="#1e293b" />
    <rect x="26" y="126" width="320" height="6" rx="3" fill="url(#emeraldGrad)" />

    <!-- Metric Card 2 -->
    <g transform="translate(0, 169)">
      <rect width="395" height="148" rx="18" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="26" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">HOSTING &amp; BANDWIDTH COST</text>
      <text x="26" y="86" fill="#fb923c" font-family="system-ui, sans-serif" font-size="42" font-weight="800">$0 / mo</text>
      <text x="26" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Unlimited static egress + 100k API calls/day</text>
      <rect x="26" y="126" width="343" height="6" rx="3" fill="#1e293b" />
      <rect x="26" y="126" width="343" height="6" rx="3" fill="url(#cfOrange)" />
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(0, 338)">
      <rect width="395" height="148" rx="18" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="26" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">EDGE MEMORY &amp; RELIABILITY</text>
      <text x="26" y="86" fill="#c084fc" font-family="system-ui, sans-serif" font-size="42" font-weight="800">17.9 MB</text>
      <text x="26" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">P50 RAM (128 MB cap)  |  0 Errors  |  9 CI Gates</text>
      <rect x="26" y="126" width="343" height="6" rx="3" fill="#1e293b" />
      <rect x="26" y="126" width="260" height="6" rx="3" fill="url(#violetGrad)" />
    </g>
  </g>
</svg>

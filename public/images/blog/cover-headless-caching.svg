<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cacheBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <!-- Gradient Accents -->
    <linearGradient id="cyanLimeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="purpleSkyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#cacheBg)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="240" r="220" fill="#06b6d4" opacity="0.09" filter="url(#glowFilter)" />
  <circle cx="920" cy="280" r="260" fill="#84cc16" opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="600" cy="180" r="180" fill="#8b5cf6" opacity="0.06" filter="url(#glowFilter)" />

  <!-- Central Architecture Console Frame -->
  <g transform="translate(160, 85)">
    <!-- Main Console Frame -->
    <rect x="50" y="30" width="780" height="400" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.96" />
    <rect x="50" y="30" width="780" height="400" rx="24" fill="none" stroke="#84cc16" stroke-width="1" stroke-opacity="0.3" />

    <!-- Window Controls -->
    <circle cx="85" cy="62" r="5" fill="#f43f5e" opacity="0.8" />
    <circle cx="105" cy="62" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="125" cy="62" r="5" fill="#10b981" opacity="0.8" />
    <line x1="150" y1="62" x2="360" y2="62" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Left Box: WordPress Origin -->
    <g transform="translate(90, 110)">
      <rect width="190" height="260" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="15" y="15" width="160" height="32" rx="8" fill="#0f172a" />
      <text x="95" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">WORDPRESS CMS</text>

      <rect x="15" y="60" width="160" height="44" rx="8" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-width="0.8" />
      <text x="25" y="78" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">save_post hook</text>
      <text x="25" y="93" fill="#64748b" font-family="monospace" font-size="9">status: publish</text>

      <rect x="15" y="115" width="160" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="133" fill="#cbd5e1" font-family="monospace" font-size="10">HMAC-SHA256</text>
      <text x="25" y="148" fill="#84cc16" font-family="monospace" font-size="9">X-Signature: sha256</text>
      <text x="25" y="160" fill="#64748b" font-family="monospace" font-size="9">non-blocking POST</text>

      <rect x="15" y="182" width="160" height="60" rx="8" fill="#0f172a" />
      <text x="25" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">MySQL DB Health:</text>
      <text x="25" y="217" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">0 Stampede Spike</text>
      <text x="25" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Queries: &lt; 15 / 1k req</text>
    </g>

    <!-- Connector: Webhook Arrow -->
    <g transform="translate(295, 230)">
      <line x1="0" y1="0" x2="65" y2="0" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 3" />
      <polygon points="65,-4 75,0 65,4" fill="#0ea5e9" />
      <rect x="8" y="-18" width="52" height="14" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="0.8" />
      <text x="34" y="-8" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">WEBHOOK</text>
    </g>

    <!-- Center Box: Next.js 16 On-Demand Revalidation Hub -->
    <g transform="translate(380, 95)">
      <rect width="210" height="290" rx="16" fill="#0b1329" stroke="#84cc16" stroke-width="1.5" />
      <rect x="15" y="15" width="180" height="34" rx="8" fill="#1e293b" />
      <text x="105" y="37" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">NEXT.JS 16 ROUTER</text>

      <rect x="15" y="60" width="180" height="46" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="78" fill="#f8fafc" font-family="monospace" font-size="10">/api/revalidate</text>
      <text x="25" y="94" fill="#10b981" font-family="monospace" font-size="9">timingSafeEqual: OK</text>

      <rect x="15" y="116" width="180" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#84cc16" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="25" y="134" fill="#a3e635" font-family="monospace" font-size="10" font-weight="700">revalidateTag()</text>
      <text x="25" y="150" fill="#cbd5e1" font-family="monospace" font-size="9">tag: 'post-unitrition'</text>
      <text x="25" y="161" fill="#64748b" font-family="monospace" font-size="8">tag: 'post-feed'</text>

      <rect x="15" y="178" width="180" height="92" rx="8" fill="#0f172a" />
      <text x="25" y="196" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Selective Edge Purge:</text>
      <text x="25" y="215" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Latency: &lt; 25ms</text>
      <text x="25" y="233" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">All other routes stay warm</text>
      <text x="25" y="250" fill="#a3e635" font-family="monospace" font-size="9">TTFB: 38ms (P95)</text>
    </g>

    <!-- Connector: Edge Deploy Arrow -->
    <g transform="translate(600, 230)">
      <line x1="0" y1="0" x2="65" y2="0" stroke="#84cc16" stroke-width="2" stroke-dasharray="4 3" />
      <polygon points="65,-4 75,0 65,4" fill="#84cc16" />
      <rect x="10" y="-18" width="48" height="14" rx="4" fill="#0f172a" stroke="#84cc16" stroke-width="0.8" />
      <text x="34" y="-8" fill="#a3e635" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">EDGE CDN</text>
    </g>

    <!-- Right Box: Client Viewers & Production Proof -->
    <g transform="translate(685, 110)">
      <rect width="180" height="260" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="15" y="15" width="150" height="32" rx="8" fill="#0f172a" />
      <text x="90" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CLIENT BROWSERS</text>

      <rect x="15" y="60" width="150" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="25" y="78" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Sub-Second CWV</text>
      <text x="25" y="93" fill="#cbd5e1" font-family="monospace" font-size="9">LCP: 0.6s | CLS: 0.00</text>
      <text x="25" y="105" fill="#64748b" font-family="monospace" font-size="9">FID: 8ms | INP: 24ms</text>

      <rect x="15" y="125" width="150" height="115" rx="8" fill="#0f172a" />
      <text x="25" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Applied in Production:</text>
      <rect x="22" y="154" width="134" height="22" rx="4" fill="#10b981" fill-opacity="0.15" />
      <text x="28" y="169" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Unitrition (unitrition.info)</text>

      <rect x="22" y="182" width="134" height="22" rx="4" fill="#0284c7" fill-opacity="0.15" />
      <text x="28" y="197" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Fullstack AI Lab</text>

      <text x="25" y="226" fill="#a3e635" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Fresh Content &lt; 80ms</text>
    </g>
  </g>

  <!-- Bottom Title Badge -->
  <g transform="translate(600, 565)">
    <rect x="-380" y="-22" width="760" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="0" y="6" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">HEADLESS WORDPRESS &amp; NEXT.JS 16: HYBRID CACHING &amp; TAG REVALIDATION</text>
  </g>
</svg>

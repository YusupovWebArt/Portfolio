    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">wasm-sandbox-runtime.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// WebContainer WASI client boot</text>
      <text y="42" fill="#38bdf8">const</text>
      <text x="45" y="42" fill="#f1f5f9">webcontainer =</text>
      <text x="160" y="42" fill="#38bdf8">await</text>
      <text x="205" y="42" fill="#f1f5f9">WebContainer.boot({</text>

      <text y="66" fill="#f1f5f9">  workdirName:</text>
      <text x="100" y="66" fill="#34d399">'ai-sandbox'</text>
      <text x="185" y="66" fill="#f1f5f9">,</text>

      <text y="90" fill="#f1f5f9">  forwardPreviewErrors:</text>
      <text x="175" y="90" fill="#f59e0b">true</text>

      <text y="112" fill="#f1f5f9">});</text>

      <text y="138" fill="#64748b">// Mount virtual filesystem snapshot</text>
      <text y="160" fill="#38bdf8">await</text>
      <text x="45" y="160" fill="#f1f5f9">webcontainer.mount(virtualFsTree);</text>

      <text y="186" fill="#38bdf8">const</text>
      <text x="45" y="186" fill="#f1f5f9">proc =</text>
      <text x="95" y="186" fill="#38bdf8">await</text>
      <text x="140" y="186" fill="#f1f5f9">webcontainer.spawn(</text>
      <text x="295" y="186" fill="#34d399">'node'</text>
      <text x="340" y="186" fill="#f1f5f9">, [</text>
      <text x="360" y="186" fill="#34d399">'main.js'</text>
      <text x="415" y="186" fill="#f1f5f9">]);</text>

      <rect y="244" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="268" fill="#64748b">// Runtime Isolation Status</text>
      <text x="14" y="292" fill="#22d3ee">Security Sandbox:</text>
      <text x="180" y="292" fill="#f1f5f9">Zero Server Escape Risk</text>

      <text x="14" y="314" fill="#a78bfa">SharedArrayBuffer:</text>
      <text x="180" y="314" fill="#f1f5f9">COOP/COEP Active</text>

      <text x="14" y="336" fill="#10b981">Host Compute Cost:</text>
      <text x="180" y="336" fill="#f1f5f9">$0.00 / 10k Sessions</text>

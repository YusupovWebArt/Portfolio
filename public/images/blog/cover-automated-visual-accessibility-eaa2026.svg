        <text x="15" y="47" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">99.4%</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="145" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">UNIT COST</text>
        <text x="15" y="47" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">€0.0018</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="175" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AUDIT STANDARD</text>
        <text x="15" y="47" fill="#a855f7" font-family="system-ui, sans-serif" font-size="17" font-weight="800">WCAG 2.2 AA</text>

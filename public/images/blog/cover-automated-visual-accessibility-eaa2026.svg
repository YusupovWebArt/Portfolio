      <tspan x="0" dy="50" fill="url(#primaryGlow)">Accessibility &amp; Schema</tspan>
      <tspan x="0" dy="50">via Multimodal LLMs</tspan>
    </text>

    <text x="0" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">

    <text x="95" y="25" fill="#94a3b8" font-family="monospace" font-size="12">vision-multimodal-pipeline.ts</text>

    <g transform="translate(25, 60)" font-family="monospace" font-size="11.5">
      <text y="20" fill="#8b5cf6">const <tspan fill="#38bdf8">VisualA11ySchema</tspan> = z.object({</text>
      <text y="42" fill="#94a3b8">  shortAltText: z.string().max(<tspan fill="#f59e0b">125</tspan>),</text>
      <text y="64" fill="#94a3b8">  isDecorative: z.boolean(),</text>
      <text y="86" fill="#94a3b8">  wcagCompliance: z.literal(<tspan fill="#10b981">'WCAG_2_2_AA'</tspan>),</text>
      <text y="108" fill="#94a3b8">  schemaOrg: z.object({</text>
      <text y="130" fill="#94a3b8">    type: z.literal(<tspan fill="#10b981">'Product'</tspan>),</text>
      <text y="152" fill="#94a3b8">    accessibilityFeature: z.array(z.string()),</text>
      <text y="174" fill="#94a3b8">    imageObject: z.object({...}),</text>
      <text y="196" fill="#94a3b8">  }),</text>
      <text y="218" fill="#8b5cf6">})</text>
      
      <rect y="240" width="400" height="110" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="15" y="265" fill="#10b981" font-weight="bold">✓ Multimodal Inference: Gemini 2.5 Flash</text>
      <text x="15" y="288" fill="#cbd5e1">• Confidence Score: <tspan fill="#38bdf8">99.4% WCAG 2.2 AA</tspan></text>
      <text x="15" y="310" fill="#cbd5e1">• Structured JSON-LD: <tspan fill="#10b981">Valid Schema.org</tspan></text>
      <text x="15" y="332" fill="#cbd5e1">• Processing Latency: <tspan fill="#f59e0b">420ms / SKU</tspan> (€0.0018)</text>
    </g>
  </g>

  <g transform="translate(90, 110)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#111122"/>
      <stop offset="100%" stop-color="#090a16"/>
    </linearGradient>
    <linearGradient id="kafkaGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#ff5722" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="180" r="160" fill="#ff5722" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="180" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>
  <circle cx="610" cy="310" r="210" fill="#06b6d4" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="360" height="34" rx="17" fill="#ff5722" fill-opacity="0.12" stroke="#ff5722" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fb923c" letter-spacing="1.5">EVENT-DRIVEN ARCHITECTURE 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Kafka &amp; Outbox Pattern</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#kafkaGlow)" letter-spacing="-0.5">Distributed Sagas</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Transactional Outbox, Debezium CDC, Redpanda Streams</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Fault-Tolerant Microservices in Next.js 16 App Router</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">CDC REPLICATION LAG</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fb923c">&lt; 18 ms</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">DUAL-WRITE LOSS</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">0.00% Zero</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">SAGA RECOVERY</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">100% ACID</text>
    </g>

    <!-- Tech Stack Pill Bar -->
    <g transform="translate(0, 355)">
      <rect width="90" height="26" rx="13" fill="#1e293b"/>
      <text x="14" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Next.js 16</text>

      <rect x="100" width="100" height="26" rx="13" fill="#1e293b"/>
      <text x="114" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">PostgreSQL</text>

      <rect x="210" width="105" height="26" rx="13" fill="#1e293b"/>
      <text x="224" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Apache Kafka</text>

      <rect x="325" width="85" height="26" rx="13" fill="#1e293b"/>
      <text x="339" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Redpanda</text>

      <rect x="420" width="85" height="26" rx="13" fill="#1e293b"/>
      <text x="434" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Debezium</text>
    </g>
  </g>

  <!-- Right: Architecture Interactive Flow Visualization -->
  <g transform="translate(680, 75)">
    <!-- Main Frame -->
    <rect width="450" height="480" rx="20" fill="#0d1322" stroke="#1e293b" stroke-width="2"/>

    <!-- Window Controls -->
    <circle cx="28" cy="28" r="6" fill="#ef4444"/>
    <circle cx="48" cy="28" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="28" r="6" fill="#10b981"/>
    <text x="92" y="32" font-family="monospace" font-size="11" fill="#64748b">event-stream-topology.ts</text>

    <!-- Node 1: Next.js 16 Server Action -->
    <g transform="translate(30, 60)">
      <rect width="390" height="65" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="10" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="20" y="36" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">1</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Next.js 16 Server Action (Order Placed)</text>
      <text x="45" y="46" font-family="monospace" font-size="11" fill="#94a3b8">BEGIN TRANSACTION: Write Order + Outbox Table</text>
      <rect x="305" y="18" width="70" height="22" rx="11" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="317" y="33" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8">ACID OK</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M225,125 V145" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,150 221,142 229,142" fill="#f59e0b"/>

    <!-- Node 2: PostgreSQL CDC (pgoutput / Debezium) -->
    <g transform="translate(30, 155)">
      <rect width="390" height="65" rx="12" fill="#111827" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="24" cy="32" r="10" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="20" y="36" font-family="monospace" font-size="12" font-weight="700" fill="#fb923c">2</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">PostgreSQL Logical Decoding (WAL)</text>
      <text x="45" y="46" font-family="monospace" font-size="11" fill="#94a3b8">Debezium CDC streaming outbox events (lag &lt; 18ms)</text>
      <rect x="305" y="18" width="70" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15"/>
      <text x="315" y="33" font-family="monospace" font-size="10" font-weight="600" fill="#fb923c">CDC LOG</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M225,220 V240" stroke="#ff5722" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,245 221,237 229,237" fill="#ff5722"/>

    <!-- Node 3: Kafka / Redpanda Distributed Log -->
    <g transform="translate(30, 250)">
      <rect width="390" height="70" rx="12" fill="#1a111a" stroke="#ff5722" stroke-width="1.5"/>
      <circle cx="24" cy="35" r="10" fill="#ff5722" fill-opacity="0.2"/>
      <text x="20" y="39" font-family="monospace" font-size="12" font-weight="700" fill="#ff5722">3</text>
      <text x="45" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Kafka / Redpanda Broker Cluster</text>
      <text x="45" y="48" font-family="monospace" font-size="11" fill="#fb923c">Topic: order.events [Partitioned by order_id]</text>
      <rect x="305" y="23" width="70" height="22" rx="11" fill="#ff5722" fill-opacity="0.2"/>
      <text x="318" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#ff7043">KAFKA</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M225,320 V340" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="225,345 221,337 229,337" fill="#10b981"/>

    <!-- Node 4: Saga Coordinator & Microservices -->
    <g transform="translate(30, 350)">
      <rect width="390" height="100" rx="12" fill="#091b15" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="20" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">4</text>
      <text x="45" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Distributed Saga Orchestration Mesh</text>
      <text x="45" y="46" font-family="monospace" font-size="11" fill="#6ee7b7">Step 1: Payment Reserve -&gt; Step 2: Inventory Lock</text>
      <text x="45" y="64" font-family="monospace" font-size="11" fill="#fca5a5">On Failure: Auto-Rollback Compensating Events</text>
      <text x="45" y="82" font-family="monospace" font-size="10" fill="#94a3b8">Idempotency Guard: Redis Bloom + Unique DB Key</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0c1830"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#06b6d4" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630"/>
  </g>

  <circle cx="210" cy="180" r="160" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="180" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="610" cy="310" r="210" fill="#10b981" opacity="0.05" filter="url(#glow)"/>

  <!-- Left: Main Title & Architecture Badges -->
  <g transform="translate(80, 110)">
    <rect width="360" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">MULTIMODAL AI &amp; WEBRTC 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Streaming Voice &amp; Vision</text>
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#aiGlow)" letter-spacing="-0.5">Edge AI Agents</text>

    <!-- Subtitle description -->
    <text x="0" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Gemini Live API, Web Audio API AudioWorklet, Duplex WebRTC</text>
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">&amp; Real-Time Generative UI in Next.js 16 App Router</text>

    <!-- Metrics Badges -->
    <g transform="translate(0, 260)">
      <rect width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">VOICE-TO-VOICE TTFT</text>
      <text x="16" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">&lt; 235 ms</text>

      <rect x="180" width="165" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="196" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">VIDEO FRAMES</text>
      <text x="196" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#c084fc">15 FPS Live</text>

      <rect x="360" width="160" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">GENERATIVE UI</text>
      <text x="376" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#34d399">Streamed RSC</text>
    </g>

    <!-- Visual Architecture Status Node -->
    <g transform="translate(0, 365)" opacity="0.9">
      <rect width="520" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="24" r="5" fill="#06b6d4"/>
      <text x="44" y="29" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">Duplex Pipeline: AudioWorklet PCM -&gt; Gemini Live API -&gt; Generative UI</text>
    </g>
  </g>

  <!-- Right: Technical HUD Box -->
  <g transform="translate(680, 95)">
    <rect width="450" height="440" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect width="450" height="40" rx="16" fill="#1e293b" opacity="0.5"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">multimodal-live-session.ts</text>

    <!-- Code Block with Syntax Highlights -->
    <g transform="translate(24, 60)" font-family="ui-monospace, monospace" font-size="11.5">
      <text y="18" fill="#64748b">// Bi-directional Gemini Live session</text>
      <text y="42" fill="#38bdf8">export async function</text>
      <text x="175" y="42" fill="#f1f5f9">connectLiveSession(</text>
      <text x="340" y="42" fill="#fbbf24">stream</text>
      <text x="390" y="42" fill="#f1f5f9">) {</text>

      <text y="66" fill="#38bdf8">  const</text>
      <text x="45" y="66" fill="#f1f5f9">session =</text>
      <text x="110" y="66" fill="#38bdf8">await</text>
      <text x="155" y="66" fill="#f1f5f9">geminiClient.createLiveStream({</text>

      <text y="88" fill="#f1f5f9">    model:</text>
      <text x="50" y="88" fill="#34d399">'gemini-2.5-flash-live'</text>
      <text x="210" y="88" fill="#f1f5f9">,</text>

      <text y="110" fill="#f1f5f9">    modalities: [</text>
      <text x="95" y="110" fill="#38bdf8">'AUDIO'</text>
      <text x="150" y="110" fill="#f1f5f9">,</text>
      <text x="165" y="110" fill="#38bdf8">'VIDEO'</text>
      <text x="220" y="110" fill="#f1f5f9">],</text>

      <text y="132" fill="#f1f5f9">  });</text>

      <text y="156" fill="#64748b">  // AudioWorklet PCM 16kHz chunk stream</text>
      <text y="178" fill="#f1f5f9">  audioWorklet.port.onmessage = (</text>
      <text x="235" y="178" fill="#fbbf24">pcm</text>
      <text x="260" y="178" fill="#f1f5f9">) =&gt; {</text>

      <text y="200" fill="#f1f5f9">    session.sendRealtimeInput([{ mimeType:</text>
      <text x="285" y="200" fill="#34d399">'audio/pcm'</text>
      <text x="365" y="200" fill="#f1f5f9">, data: pcm }]);</text>

      <text y="222" fill="#f1f5f9">  };</text>

      <rect y="246" width="402" height="110" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="270" fill="#64748b">// Realtime Conversational Stats</text>
      <text x="14" y="292" fill="#38bdf8">Audio In-Flight Latency:</text>
      <text x="185" y="292" fill="#f1f5f9">14 ms (AudioWorklet)</text>

      <text x="14" y="314" fill="#c084fc">Gemini Response TTFT:</text>
      <text x="185" y="314" fill="#f1f5f9">235 ms Edge-to-Ear</text>

      <text x="14" y="336" fill="#34d399">Tool-Calling UI Render:</text>
      <text x="185" y="336" fill="#f1f5f9">Zero Layout Shift</text>
    </g>
  </g>
</svg>
